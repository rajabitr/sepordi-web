  /tenants/{ext}/catalog-import-jobs/{job_id}/commit:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: commitCatalogImportJob
      tags: [catalog]
      summary: Write the job's products in the background
      description: |
        Starts the commit and answers at once with the job `committing`; poll getCatalogImportJob until `done` or
        `error`, or subscribe a webhook to `import.completed`, sent once when the job ends with the business in its
        envelope. Each valid product is written exactly as putProduct writes it (variants authoritative, a dropped one

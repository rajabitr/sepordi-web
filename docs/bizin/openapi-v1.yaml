        "501": { $ref: "#/components/responses/NotImplemented" }

webhooks:
  event:
    post:
      operationId: receiveEvent
      summary: One event delivered to a partner endpoint
      description: |
        Signed with `Bizin-Signature: t=<unix>,v1=<hex>[,v1=<hex>]`, where
        v1 = hex(HMAC-SHA256(endpoint secret, "<t>." + raw body)). Accept when any v1 matches and |now - t| <= 300 s,
        then de-duplicate by `Bizin-Event-Id`. 2xx = delivered. 5xx, 408, 429, timeouts and connection failures are
        retried (8 attempts over about 4 h 43 min); 410 dead-letters the delivery and disables the endpoint; any other
        status dead-letters it at once. Redirects are not followed.
      security: []
      parameters:
        - { name: Bizin-Event-Id, in: header, required: true, schema: { type: string, pattern: "^evt_" } }
        - { name: Bizin-Event-Type, in: header, required: true, schema: { type: string } }
        - { name: Bizin-Delivery-Attempt, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: Bizin-Signature, in: header, required: true, schema: { type: string } }
        - { name: User-Agent, in: header, required: true, schema: { const: Bizin-Webhooks/1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Event" }
            example:
              id: evt_2f6b8d14-7c3a-4e95-b1d0-9a5e3c7f1b26
              type: channel.connected
              api_version: v1
              occurred_at: "2026-10-13T10:02:11Z"
              tenant: { id: 0b1c6f0e-8d2a-4c3b-9a71-5e2f4d8c1a90, external_business_id: biz-778 }
              data: { channel_id: 3e9b7c21-5a4d-4f86-9c0e-1b2d3f4a5c6e, channel_kind: instagram, status: connected }
      responses:
        "2XX":
          description: Delivered

components:
  securitySchemes:
    partnerKey:
      type: http
      scheme: bearer
      bearerFormat: "bzp_<16 base32 chars>_<43 base64url chars>"
      description: |
        A partner key issued by a Bizin operator. Only SHA-256 of the secret is stored. Missing, malformed, unknown,
        wrong, revoked and expired keys all answer 401 `invalid_partner_key`; a suspended partner's key answers 403
        `partner_suspended`. 30 failed authentications from one address in 15 minutes block that address (429).

  parameters:
    Ext:
      name: ext
      in: path
      required: true
      description: The partner's external_business_id (1-128 characters). Use unreserved URL characters.
      schema: { type: string, minLength: 1, maxLength: 128 }
    WebhookID:
      name: id
      in: path
      required: true
      description: A webhook endpoint id. Not a uuid, or not the caller's, is 404 `not_found`.
      schema: { type: string, format: uuid }
    Locale:
      name: locale
      in: path
      required: true
      description: en, ar or fa; any other is 404 `not_found`.
      schema: { $ref: "#/components/schemas/ReplyLanguage" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-255 printable ASCII characters. Scoped to (partner, method, path); kept 24 h.
      schema: { type: string, minLength: 1, maxLength: 255 }
    ChannelID:
      name: channel_id
      in: path
      required: true
      description: A channel account id from the channel list or a connect answer. Not a uuid, or not this business's, is 404 `channel_account_not_found`.
      schema: { type: string, format: uuid }
    ProductExt:
      name: product_ext
      in: path
      required: true
      description: The partner's product external_id (1-128 characters after percent-decoding). Invalid is 400 `invalid_value` (field product_external_id).
      schema: { type: string, minLength: 1, maxLength: 128 }
    OrderID:
      name: order_id
      in: path
      required: true
      description: An order id, as in the order.created webhook. Not a uuid, or not this business's, is 404 `order_not_found`.
      schema: { type: string, format: uuid }
    CaseID:
      name: case_id
      in: path
      required: true
      description: A case id, as in the case.opened webhook. Not a uuid, or not this business's, is 404 `case_not_found`.
      schema: { type: string, format: uuid }
    PhotoID:
      name: photo_id
      in: path
      required: true
      description: A photo id from the case's `photos`. Anything else is 404 `photo_not_found`.
      schema: { type: string, format: uuid }
    EvidenceID:
      name: evidence_id
      in: path
      required: true
      description: A receipt id from the order's payment-evidence list. Anything else, a receipt of another order included, is 404 `evidence_not_found`.
      schema: { type: string, format: uuid }
    ConversationID:
      name: conversation_id
      in: path
      required: true
      description: A conversation id, as in a webhook's data.conversation_id. Not a uuid, or not this business's, is 404 `conversation_not_found`.
      schema: { type: string, format: uuid }
    MessageID:
      name: message_id
      in: path
      required: true
      description: A message id, as in message.received or message.sent. Not a uuid, or not a message of that conversation, is 404 `message_not_found`.
      schema: { type: string, format: uuid }
    MediaID:
      name: media_id
      in: path
      required: true
      description: The `media.id` of a message. Not a uuid, or no message of this shop carries it, is 404 `media_not_found`.
      schema: { type: string, format: uuid }
    JobID:
      name: job_id
      in: path
      required: true
      description: A job id, as createOnboardingJob or createCatalogImportJob answered it. Not a uuid, or not this partner's (for a catalogue job, not this business's), is 404 `import_job_not_found`.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      description: Outside 1-100 is 400 `limit_invalid` (params.max).
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: The previous page's `next_cursor`, opaque. One that does not parse is 400 `invalid_value` (field cursor).

  headers:
    RateLimit-Limit:
      description: The partner's api_rate_per_minute.
      schema: { type: integer }
    RateLimit-Remaining:
      description: Whole tokens left in the partner's bucket after this request.
      schema: { type: integer }
    RateLimit-Reset:
      description: Seconds until the bucket is full again.
      schema: { type: integer }

  responses:
    BadRequest:
      description: "`bad_request_body`, `invalid_value` (query), `limit_invalid`, `external_business_id_invalid` (path), `idempotency_key_required`, `idempotency_key_invalid`, `idempotency_body_unreadable`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: idempotency_key_required
            code: idempotency_key_required
            message: this request needs an Idempotency-Key header
            request_id: 6d3c0e7a-4f71-4c55-9e0b-6f1c2a8b9d10
    BadExternalID:
      description: "`external_business_id_invalid`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`invalid_partner_key`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`insufficient_scope` (params.required), `partner_suspended`, `feature_not_entitled` (params.feature, an operation with x-feature), or `entitlement_exceeded` (params.limit, value, used: POST /tenants)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: insufficient_scope
            code: insufficient_scope
            message: this key does not hold the scope this route needs
            params: { required: "tenants:provision" }
            request_id: 6d3c0e7a-4f71-4c55-9e0b-6f1c2a8b9d10
    NotFound:
      description: "`not_found` (flag off, unknown route or method, or an endpoint id that is not the caller's)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TenantNotFound:
      description: "`tenant_not_found` (unknown id or another partner's tenant), or `not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EvidenceNotFound:
      description: "`tenant_not_found`, `evidence_not_found` (not a uuid, not this order's receipt, or the picture is gone), `order_not_found` (order_id not a uuid), or `not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentConflict:
      description: "`payment_verification_off`, `evidence_already_decided` (params.status), `order_not_awaiting_payment` (params.status, params.payment_status), `idempotency_request_in_progress` or `idempotency_replay_unavailable`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CaseNotFound:
      description: "`tenant_not_found`, `case_not_found` (not a uuid or not this business's), or `not_found` (returns switched off)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ConversationNotFound:
      description: "`tenant_not_found`, `conversation_not_found` (not a uuid or not this business's), or `not_found` (inbox switched off)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyConflict:
      description: "`idempotency_request_in_progress` (Retry-After: 1) or `idempotency_replay_unavailable`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeyReused:
      description: "`idempotency_key_reused`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    JobNotFound:
      description: "`import_job_not_found` (also another partner's job), or `not_found` while v3.partner.bulk_jobs is off"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CatalogJobNotFound:
      description: "`tenant_not_found` (also another partner's business), `import_job_not_found` (also a job of another of your businesses), or `not_found` while v3.partner.bulk_jobs is off"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WebhookInvalid:
      description: "`webhook_url_refused` (field url), `invalid_value` (field event_types, description or status), or `idempotency_key_reused`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: "`idempotency_body_too_large` (params.max_mb)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited` (params.retry_after_seconds)"
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: "`internal_error`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: "`idempotency_unavailable`, or `secrets_unavailable` (webhook create and rotate-secret)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotImplemented:
      description: "`not_implemented` — only on a server started without its secrets keyring"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, code, message]
      properties:
        error: { type: string, description: Same value as code. }
        code: { type: string, description: Stable machine-readable code; branch on it. }
        message: { type: string, description: English sentence for developers; wording may change. }
        field: { type: string, description: The input at fault, as a dotted path. }
        params: { type: object, additionalProperties: true }
        request_id: { type: string, description: Repeats the X-Request-Id response header. }

    Limits:
      type: object
      required: [api_rate_per_minute, api_burst, provision_per_day]
      properties:
        api_rate_per_minute: { type: integer, minimum: 1, maximum: 6000 }
        api_burst: { type: integer, minimum: 1, maximum: 1000 }
        provision_per_day: { type: integer, minimum: 0, maximum: 100000 }

    Me:
      type: object
      required: [partner_id, key_id, scopes, limits]
      properties:
        partner_id: { type: string, format: uuid }
        key_id: { type: string, pattern: "^[a-z2-7]{16}$" }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        limits: { $ref: "#/components/schemas/Limits" }

    Scope:
      type: string
      enum: ["tenants:provision", "tenants:read", "channels:read", "channels:connect", "stats:read", "webhooks:manage", "users:activate",
        "orders:read", "assistant:read", "assistant:write", "payments:read", "payments:write", "catalog:write", "catalog:read",
        "cases:read", "cases:write", "payments:verify", "orders:fulfil", "inbox:read", "inbox:media", "inbox:write",
        "shipping:read", "shipping:write", "entitlements:read", "entitlements:write", "branding:read", "branding:write"]

    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [external_business_id, name, market_profile, owner]
      properties:
        external_business_id: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 200 }
        reply_language:
          type: string
          default: en
          description: One of the supported reply languages (today en, ar, fa); params.allowed lists them.
        market_profile:
          type: string
          enum: [ir, ae, intl]
          x-extensible-enum: true
          description: Required, no default. One of the selectable profiles; params.allowed lists them.
        metadata:
          type: [object, "null"]
          description: At most 8 KiB. Stored for the partner; not returned by the read routes.
        owner:
          type: object
          additionalProperties: false
          required: [external_user_id, email, display_name]
          properties:
            external_user_id: { type: string, minLength: 1, maxLength: 128 }
            email: { type: string, format: email, description: A bare address; stored lower-case. }
            display_name: { type: string, minLength: 1, maxLength: 200 }
            locale:
              type: string
              enum: [fa, en, ar]
              description: The owner's panel language; omitted leaves it unset.
            phone:
              type: string
              description: >-
                Optional. Stored as E.164 with the owner's partner user reference. A number without a country
                code is read only as a mobile of the tenant's market (ir 09xx…, ae 05x…); otherwise
                422 invalid_value on owner.phone.

    Tenant:
      type: object
      required: [id, external_business_id, name, status, reply_language, market_profile, created_at]
      properties:
        id: { type: string, format: uuid, description: "Bizin's tenant id: opaque, for support." }
        external_business_id: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, suspended], description: Always active today. }
        reply_language: { $ref: "#/components/schemas/ReplyLanguage" }
        market_profile: { type: string }
        created_at: { type: string, format: date-time }

    Owner:
      type: object
      required: [user_id, external_user_id, status]
      properties:
        user_id: { type: string, format: uuid }
        external_user_id: { type: string, description: Empty for an owner the partner did not provision. }
        status: { type: string, enum: [pending, active, disabled] }

    Channel:
      type: object
      required: [channel_id, kind, status, connected_at]
      properties:
        channel_id: { type: string, format: uuid, description: "The {channel_id} of the pairing poll and of DELETE /tenants/{ext}/channels/{channel_id}." }
        kind: { $ref: "#/components/schemas/ChannelKind" }
        status: { type: string, enum: [disconnected, pairing, connected, banned, error] }
        connected_at: { type: [string, "null"], format: date-time, description: Set only while connected. }
        health:
          description: >-
            Only on getTenantChannels, and only while channel health is switched on for the business; absent otherwise.
            null while the channel is not connected or before its first check.
          oneOf:
            - { $ref: "#/components/schemas/ChannelHealth" }
            - { type: "null" }

    ChannelHealth:
      type: object
      description: >-
        Whether the provider is still delivering to a connected channel. broken and degraded rest on a provider's
        answer, never on silence; quiet is a long silence while the provider's checks pass, and is never sent as an
        event. A move into or out of degraded or broken raises channel.health_changed.
      required: [state, reason, since]
      properties:
        state: { $ref: "#/components/schemas/ChannelHealthState" }
        reason: { $ref: "#/components/schemas/ChannelHealthReason" }
        since: { type: string, format: date-time, description: When the channel entered this state. }

    ChannelHealthState:
      type: string
      enum: [ok, quiet, degraded, broken, unknown]
      x-extensible-enum: true

    ChannelHealthReason:
      type: string
      description: "A closed token, never a provider's own text; none while ok."
      enum: [none, idle, unusual_silence, wa_socket_down, wa_session_missing, tg_webhook_empty, tg_webhook_foreign,
        tg_delivery_failing, tg_updates_incomplete, tg_token_rejected, ig_subscription_missing, ig_token_rejected,
        ig_token_expiring, ig_scope_missing, probe_unreachable]
      x-extensible-enum: true

    Credit:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [ok, exhausted], description: exhausted when the AI credit balance is zero or below. }

    TenantDetail:
      type: object
      required: [tenant, owner, channels, credit]
      properties:
        tenant: { $ref: "#/components/schemas/Tenant" }
        owner:
          oneOf:
            - { $ref: "#/components/schemas/Owner" }
            - { type: "null" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
        credit: { $ref: "#/components/schemas/Credit" }
        created: { type: boolean, description: "Only on POST /tenants: true on 201, false on 200." }

    TenantList:
      type: object
      required: [tenants, next_cursor]
      properties:
        tenants:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }
        next_cursor: { type: [string, "null"] }

    StatsDay:
      type: object
      required: [date, conversations_started, automated_replies, handoffs, orders_created]
      properties:
        date: { type: string, format: date }
        conversations_started: { type: integer, minimum: 0 }
        automated_replies: { type: integer, minimum: 0 }
        handoffs: { type: integer, minimum: 0 }
        orders_created: { type: integer, minimum: 0 }

    ConnectLinkRequest:
      type: object
      additionalProperties: false
      required: [channel, return_url]
      properties:
        channel: { type: string, enum: [instagram] }
        return_url:
          type: string
          format: uri
          maxLength: 2048
          description: https, exact origin among the partner's return origins.
        replace: { type: boolean, default: false }

    ConnectLink:
      type: object
      required: [id, url, expires_at]
      properties:
        id: { type: string, format: uuid, description: "Comes back as the `link` query parameter on return_url." }
        url: { type: [string, "null"], format: uri, description: "null on a replay (url_redacted_on_replay: true)." }
        expires_at: { type: string, format: date-time }
        url_redacted_on_replay: { type: boolean }

    ActivationLink:
      type: object
      required: [activation_url, expires_at]
      properties:
        activation_url: { type: [string, "null"], format: uri, description: "null on a replay (activation_url_redacted_on_replay: true)." }
        expires_at: { type: string, format: date-time }
        activation_url_redacted_on_replay: { type: boolean }

    EventType:
      type: string
      enum: [tenant.provisioned, channel.connected, channel.disconnected, handoff.raised, handoff.released, message.received, message.sent, order.created, order.status_changed, payment.evidence_received, credit.exhausted, case.opened, case.updated, entitlements.changed, import.completed, channel.health_changed, ping]
      x-extensible-enum: true
      description: "Ignore a type you do not know."

    EventSubscription:
      type: string
      description: "An event type an endpoint subscribes to: any but ping, or * for every one, including types added later."
      enum: ["*", tenant.provisioned, channel.connected, channel.disconnected, handoff.raised, handoff.released, message.received, message.sent, order.created, order.status_changed, payment.evidence_received, credit.exhausted, case.opened, case.updated, entitlements.changed, import.completed, channel.health_changed]
      x-extensible-enum: true

    Webhook:
      type: object
      required: [id, url, event_types, status, disabled_reason, consecutive_failures, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/EventSubscription" }
        status: { type: string, enum: [active, disabled] }
        disabled_reason: { type: [string, "null"], enum: [partner, gone, failing, operator, null] }
        consecutive_failures: { type: integer, minimum: 0 }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookEnvelope:
      type: object
      required: [webhook]
      properties:
        webhook: { $ref: "#/components/schemas/Webhook" }

    WebhookCreate:
      type: object
      additionalProperties: false
      required: [url, event_types]
      properties:
        url: { type: string, maxLength: 2048, description: "https on port 443, a public host; no credentials, no fragment." }
        event_types:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/EventSubscription" }
        description: { type: string, maxLength: 200, default: "" }

    WebhookPatch:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 2048 }
        event_types:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/EventSubscription" }
        status: { type: string, enum: [active, disabled] }
        description: { type: string, maxLength: 200 }

    WebhookWithSecret:
      type: object
      required: [webhook, secret]
      properties:
        webhook: { $ref: "#/components/schemas/Webhook" }
        secret: { type: [string, "null"], pattern: "^whsec_", description: "Shown once; null on a replay (secret_redacted_on_replay: true)." }
        previous_secret_valid_until: { type: string, format: date-time, description: "Only on rotate-secret." }
        secret_redacted_on_replay: { type: boolean }

    Delivery:
      type: object
      required: [event_id, event_type, occurred_at, state, attempts, last_status, last_error, last_attempt_at, delivered_at]
      properties:
        event_id: { type: string, format: uuid, description: "The bare uuid; the body's id is evt_<uuid>." }
        event_type: { $ref: "#/components/schemas/EventType" }
        occurred_at: { type: string, format: date-time }
        state: { type: string, enum: [pending, delivered, dead, cancelled] }
        attempts: { type: integer, minimum: 0 }
        last_status: { type: [integer, "null"] }
        last_error: { type: [string, "null"], enum: [timeout, dial_refused, tls, http_4xx, http_5xx, gone, null] }
        last_attempt_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }

    Event:
      type: object
      required: [id, type, api_version, occurred_at, tenant, data]
      properties:
        id: { type: string, pattern: "^evt_", description: Stable across attempts and replays; de-duplicate on it. }
        type: { $ref: "#/components/schemas/EventType" }
        api_version: { const: v1 }
        occurred_at: { type: string, format: date-time }
        tenant:
          oneOf:
            - type: object
              required: [id, external_business_id]
              properties:
                id: { type: string, format: uuid }
                external_business_id: { type: string }
            - { type: "null", description: "a ping, an import.completed of kind tenants, and an entitlements.changed of scope partner" }
        data:
          description: "The type's payload; ids and states only."
          oneOf:
            - title: tenant.provisioned, ping
              type: object
              additionalProperties: false
            - title: channel.connected, channel.disconnected
              type: object
              required: [channel_id, channel_kind, status]
              properties:
                channel_id: { type: string, format: uuid, description: The channel_id of getTenantChannels. }
                channel_kind: { $ref: "#/components/schemas/ChannelKind" }
                status: { type: string, enum: [disconnected, pairing, connected, banned, error] }
            - title: handoff.raised
              type: object
              required: [conversation_id, channel_kind, reason, reason_class, queue, priority]
              properties:
                conversation_id: { type: string, format: uuid }
                channel_kind: { oneOf: [{ $ref: "#/components/schemas/ChannelKind" }, { type: "null" }] }
                reason: { type: string, maxLength: 64 }
                reason_class: { type: string, enum: [EXPLICIT_HUMAN_REQUEST, POLICY_REQUIRED, PAYMENT_VERIFICATION, CLARIFICATION_EXHAUSTED, HIGH_RISK_LOW_CONFIDENCE, INTEGRATION_FAILURE, SYSTEM_FAILURE, NONE] }
                queue: { type: string, enum: [sales, support, accounting, appointment, fulfillment], description: The queue the platform routed the raise to. }
                priority: { type: string, enum: [low, normal, high, urgent] }
            - title: handoff.released
              type: object
              required: [conversation_id, channel_kind, from]
              properties:
                conversation_id: { type: string, format: uuid }
                channel_kind: { oneOf: [{ $ref: "#/components/schemas/ChannelKind" }, { type: "null" }] }
                from: { type: string, enum: [handoff, human], description: The state the thread left; it is back with the assistant. }
            - title: message.received
              type: object
              required: [conversation_id, message_id, channel_kind, kind]
              properties:
                conversation_id: { type: string, format: uuid }
                message_id: { type: string, format: uuid }
                channel_kind: { oneOf: [{ $ref: "#/components/schemas/ChannelKind" }, { type: "null" }] }
                kind: { $ref: "#/components/schemas/MessageKind" }
            - title: message.sent
              type: object
              required: [conversation_id, message_id, channel_kind, kind, sender]
              properties:
                conversation_id: { type: string, format: uuid }
                message_id: { type: string, format: uuid }
                channel_kind: { oneOf: [{ $ref: "#/components/schemas/ChannelKind" }, { type: "null" }] }
                kind: { $ref: "#/components/schemas/MessageKind" }
                sender: { type: string, enum: [ai, human], description: The sender when the message was stored. }
            - title: order.created
              type: object
              required: [order_id, code, status, source]
              properties:
                order_id: { type: string, format: uuid }
                code: { type: string }
                status: { $ref: "#/components/schemas/OrderStatus" }
                source: { type: string, enum: [dashboard, ai, api] }
            - title: order.status_changed
              type: object
              required: [order_id, code, from, to, payment_status]
              properties:
                order_id: { type: string, format: uuid }
                code: { type: string }
                from: { $ref: "#/components/schemas/OrderStatus" }
                to: { $ref: "#/components/schemas/OrderStatus" }
                payment_status: { $ref: "#/components/schemas/PaymentStatus" }
            - title: payment.evidence_received
              type: object
              required: [evidence_id, order_id, code, kind]
              properties:
                evidence_id: { type: string, format: uuid }
                order_id: { type: string, format: uuid }
                code: { type: string }
                kind: { type: string, enum: [image, text] }
            - title: credit.exhausted
              type: object
              required: [state]
              properties:
                state: { const: exhausted }
            - title: case.opened
              type: object
              required: [case_id, code, kind, state, order_id, order_unresolved, conversation_id, channel_kind]
              properties:
                case_id: { type: string, format: uuid }
                code: { type: string }
                kind: { $ref: "#/components/schemas/CaseKind" }
                state: { const: open }
                order_id: { type: [string, "null"], format: uuid }
                order_unresolved: { type: boolean }
                conversation_id: { type: string, format: uuid }
                channel_kind: { oneOf: [{ $ref: "#/components/schemas/ChannelKind" }, { type: "null" }] }
            - title: case.updated
              type: object
              required: [case_id, code, kind, action, actor, previous_state, state, photo_count]
              properties:
                case_id: { type: string, format: uuid }
                code: { type: string }
                kind: { $ref: "#/components/schemas/CaseKind" }
                action: { type: string, enum: [photo_added, customer_replied, request_info, accept, reject, mark_refunded, mark_exchanged, close], description: "Every case event but the first (opened), which is case.opened." }
                actor: { type: string, enum: [customer, assistant, partner, seller, system], description: "The class only, never a key or user id." }
                previous_state: { oneOf: [{ $ref: "#/components/schemas/CaseState" }, { type: "null" }] }
                state: { $ref: "#/components/schemas/CaseState" }
                photo_count: { type: integer, minimum: 0 }
            - title: entitlements.changed
              type: object
              description: "Ids and the contract version only; read the entitlements under entitlements:read."
              required: [scope, external_business_id, contract_version]
              properties:
                scope: { type: string, enum: [tenant, partner], x-extensible-enum: true }
                external_business_id: { type: [string, "null"], description: "null for scope partner" }
                contract_version: { type: integer, minimum: 0 }
            - title: import.completed
              type: object
              description: "An onboarding or catalogue job ended; the ids, status and counts only, never a row. Read the per-row result with listOnboardingJobRows or listCatalogImportJobRows. A kind tenants job spans many businesses, so its envelope tenant is null; a kind products job's envelope names its business."
              required: [job_id, kind, status, created, updated, unchanged, failed, not_attempted]
              properties:
                job_id: { type: string, format: uuid }
                kind: { type: string, enum: [tenants, products], x-extensible-enum: true }
                status: { type: string, enum: [done, error], description: "The job's status as getOnboardingJob or getCatalogImportJob shows it." }
                created: { type: integer, minimum: 0 }
                updated: { type: integer, minimum: 0 }
                unchanged: { type: integer, minimum: 0 }
                failed: { type: integer, minimum: 0 }
                not_attempted: { type: integer, minimum: 0 }
            - title: channel.health_changed
              type: object
              description: "A connected channel's health moved into or out of degraded or broken: states and the reason token only. Moves among ok, quiet and unknown are not sent. Sent only while channel health is switched on for the business."
              required: [channel_id, channel_kind, state, previous_state, reason]
              properties:
                channel_id: { type: string, format: uuid, description: The channel_id of getTenantChannels. }
                channel_kind: { $ref: "#/components/schemas/ChannelKind" }
                state: { $ref: "#/components/schemas/ChannelHealthState" }
                previous_state: { $ref: "#/components/schemas/ChannelHealthState" }
                reason: { $ref: "#/components/schemas/ChannelHealthReason" }

    Feature:
      type: string
      description: "A partner contract feature."
      enum: [channel.whatsapp, channel.instagram, channel.telegram, inbox.api, payments.verification, returns.cases,
        shipping.rules, flows.advanced, instagram.comments]
      x-extensible-enum: true

    EntitlementSource:
      type: string
      description: "What decided the entry: the contract, the partner's own narrowing of the business (tenant), or Bizin support (operator)."
      enum: [contract, tenant, operator]
      x-extensible-enum: true

    Contract:
      type: object
      required: [contract, features, limits, next]
      properties:
        contract:
          description: "The version in force; null only when none is (every gated operation then refuses)."
          oneOf:
            - type: object
              required: [version, effective_from, commercial_ref]
              properties:
                version: { type: integer, minimum: 1 }
                effective_from: { type: string, format: date-time }
                commercial_ref: { type: [string, "null"], description: "The offline agreement it records." }
            - { type: "null" }
        features:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
        limits:
          type: object
          description: "One entry per limited key; a key with no entry is unlimited."
          additionalProperties:
            type: object
            required: [value, used]
            properties:
              value: { type: integer, minimum: 0 }
              used: { type: [integer, "null"], description: "Businesses provisioned, for tenants.max; null for a per-business limit (read it on the business)." }
        next:
          description: "The next version scheduled, or null."
          oneOf:
            - type: object
              required: [version, effective_from]
              properties:
                version: { type: integer, minimum: 1 }
                effective_from: { type: string, format: date-time }
            - { type: "null" }

    ShopEntitlements:
      type: object
      required: [external_business_id, contract_version, features, limits]
      properties:
        external_business_id: { type: string }
        contract_version: { type: integer, minimum: 0, description: "0 when no contract version is in force." }
        features:
          type: object
          description: "Every feature of the catalogue."
          additionalProperties:
            type: object
            required: [allowed, source]
            properties:
              allowed: { type: boolean }
              source: { $ref: "#/components/schemas/EntitlementSource" }
              over_contract: { type: boolean, description: "Present and true when a channel of a feature not allowed is still connected; nothing is paused." }
        limits:
          type: object
          description: "channels.max and products.max."
          additionalProperties:
            type: object
            required: [value, used, source]
            properties:
              value: { type: [integer, "null"], description: "null is unlimited." }
              used: { type: integer, minimum: 0 }
              source: { $ref: "#/components/schemas/EntitlementSource" }
              over_contract: { type: boolean, description: "Present and true when more is counted than the limit allows; nothing is removed." }

    Branding:
      type: object
      required: [mode, names, support_label, support_url, logo_url, disclosures, updated_at]
      properties:
        mode:
          type: string
          enum: [direct, partner, co_brand]
          x-extensible-enum: true
          description: Set by Bizin support only.
        names:
          type: object
          description: Your name by locale (en, ar, fa). A locale without one shows the English name, then your slug.
          additionalProperties: { type: string, minLength: 1, maxLength: 60 }
        support_label:
          type: object
          description: What a business's activity log calls your support, by locale.
          additionalProperties: { type: string, minLength: 1, maxLength: 60 }
        support_url: { type: [string, "null"], format: uri }
        logo_url: { type: [string, "null"], format: uri, description: Public; the id changes with the logo. }
        disclosures:
          type: object
          required: [en, ar, fa]
          properties:
            en: { $ref: "#/components/schemas/BrandDisclosure" }
            ar: { $ref: "#/components/schemas/BrandDisclosure" }
            fa: { $ref: "#/components/schemas/BrandDisclosure" }
        updated_at: { type: [string, "null"], format: date-time, description: Null until the first write. }

    BrandDisclosure:
      type: object
      required: [text, source]
      properties:
        text: { type: string, minLength: 1, description: The text that is sent; never empty. }
        source: { type: string, enum: [brand, default], x-extensible-enum: true }

    BrandingPut:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        names:
          type: [object, "null"]
          propertyNames: { $ref: "#/components/schemas/ReplyLanguage" }
          additionalProperties: { type: string, minLength: 1, maxLength: 60 }
        support_label:
          type: [object, "null"]
          propertyNames: { $ref: "#/components/schemas/ReplyLanguage" }
          additionalProperties: { type: string, minLength: 1, maxLength: 60 }
        support_url: { type: [string, "null"], format: uri, pattern: "^https://", maxLength: 500 }

    DisclosurePut:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: [string, "null"], minLength: 20, maxLength: 220, description: Null goes back to Bizin's default. }

    DisclosureInvalid:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          required: [params]
          properties:
            params:
              type: object
              required: [reason, locale]
              properties:
                reason: { $ref: "#/components/schemas/DisclosureInvalidReason" }
                locale: { $ref: "#/components/schemas/ReplyLanguage" }

    DisclosureInvalidReason:
      type: string
      enum: [empty, too_short, too_long, not_bot, no_human, wrong_script, no_handoff_word]
      description: The P6 rule the text breaks, in the order they are checked.

    ShopEntitlementsPut:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        features:
          type: object
          description: "false narrows the feature for this business; true or null drops your narrowing, so the contract decides again."
          additionalProperties: { type: [boolean, "null"] }
        limits:
          type: object
          description: "channels.max or products.max: a value narrows the contract's limit for this business; null drops your value."
          additionalProperties: { type: [integer, "null"], minimum: 0, maximum: 1000000 }

    WhatsAppConnectRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, description: The channel's label for sellers; stored trimmed. }

    TelegramConnectRequest:
      type: object
      additionalProperties: false
      required: [bot_token]
      properties:
        bot_token:
          type: string
          writeOnly: true
          pattern: "^\\d{5,16}:[A-Za-z0-9_-]{30,64}$"
          description: The @BotFather token, matched after trimming. Never returned, logged or replayed.
        display_name:
          type: string
          description: Default the bot's first name, then its username; longer than 100 characters is cut.

    ChannelConnect:
      type: object
      required: [channel_id, status]
      properties:
        channel_id: { type: string, format: uuid }
        status:
          type: string
          description: "WhatsApp: pending (poll the pairing route). Telegram: the account's status, connected on success."

    Pairing:
      type: object
      required: [status, expires_at]
      properties:
        status:
          type: string
          enum: [pending, qr, connected, failed, expired]
          description: "connected, failed and expired are terminal; after failed or expired delete the channel and start again."
        qr:
          type: string
          description: Only in state qr. The raw pairing payload to render as a QR code for the seller; a credential.
        expires_at: { type: [string, "null"], format: date-time, description: When this QR stops working; null except in state qr. }

    VariantPut:
      type: object
      additionalProperties: false
      required: [external_id, price]
      properties:
        external_id: { type: string, minLength: 1, maxLength: 128, description: "Unique across the business's products; once per body." }
        title: { type: string, maxLength: 120, description: The variant's name. Not with options. }
        options:
          type: array
          items: { type: string, minLength: 1 }
          description: "Joined with \" / \" into the name. Not with title."
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000000
          description: In the market's storage unit (IRR whole Rial for ir).
        stock:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000000
          description: Sets the counted level to exactly this value; null or absent turns counting off.

    ProductPut:
      type: object
      additionalProperties: false
      required: [title, active, variants]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        category: { type: string, description: Canonicalised as in the panel. }
        sku: { type: string, maxLength: 64, description: "Unique among the business's products when not empty (409 sku_taken)." }
        active: { type: boolean, description: "true on sale; false archived." }
        variants:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/VariantPut" }

    Variant:
      type: object
      required: [id, external_id, title, price, stock, active]
      properties:
        id: { type: string, format: uuid }
        external_id: { type: [string, "null"], description: null for a variant made in the panel. }
        title: { type: string, description: The variant's name; empty for an unnamed variant. }
        price: { type: integer, format: int64 }
        stock: { type: [integer, "null"], description: The live counted level; null while not counted. }
        active: { type: boolean, description: false once a PUT left the variant out. }

    Product:
      type: object
      required: [id, external_id, title, description, category, sku, active, currency, price_exponent, variants, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        external_id: { type: [string, "null"], description: null for a product made in the panel. }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        sku: { type: string }
        active: { type: boolean, description: false when archived. }
        currency: { type: string, description: "The market's currency: IRR, AED or USD." }
        price_exponent: { type: integer, description: "Decimal digits of the price unit: 0 for IRR (whole Rial), 2 for AED and USD." }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created: { type: boolean, description: "Only on PUT: true on 201, false on 200." }

    ProductList:
      type: object
      required: [products, next_cursor]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        next_cursor: { type: [string, "null"] }

    PaymentDetailsPut:
      type: object
      additionalProperties: false
      required: [holder_name]
      description: The whole destination; a field left out is cleared. card_number or iban is required.
      properties:
        card_number:
          type: string
          writeOnly: true
          description: 16 digits passing Luhn; spaces, hyphens, dots and ZWNJ dropped; Persian and Arabic-Indic digits read as digits.
        iban:
          type: string
          writeOnly: true
          description: IR followed by 24 digits, any case, valid IBAN checksum.
        holder_name: { type: string, minLength: 1, maxLength: 60 }
        bank_name: { type: string, maxLength: 60 }

    PaymentDetails:
      type: object
      required: [configured, card_number_last4, iban_last4, holder_name, bank_name]
      description: Masked; no answer carries a whole card number or IBAN.
      properties:
        configured: { type: boolean, description: A card number or an IBAN is set. }
        card_number_last4: { type: [string, "null"], pattern: "^[0-9]{4}$" }
        iban_last4: { type: [string, "null"], pattern: "^[0-9]{4}$" }
        holder_name: { type: string }
        bank_name: { type: string }

    ShippingBasis:
      type: string
      enum: [manual, flat, province, city, free, unresolved]
      x-extensible-enum: true
      description: |
        How shipping was decided; left out when the shop's rules were off at the order's last pricing. `manual` is
        the seller's own fee, `flat` the default fee, `free` the free-over threshold (shipping is then left out as
        zero), `unresolved` a draft whose address no rule prices yet.

    ShippingRate:
      type: object
      additionalProperties: false
      required: [province, fee]
      properties:
        province: { type: string, description: "Any spelling the place list knows (Fars, فارس); answered as its place name." }
        city: { type: string, description: A city of that province; left out for a province-wide rate. }
        fee: { type: integer, format: int64, minimum: 0, description: "In the storage unit; a whole quote unit (a multiple of 10 for IRR)." }

    ShippingPut:
      type: object
      additionalProperties: false
      description: |
        The whole rule set; a field left out is cleared. currency, minor_unit and updated_at are accepted and ignored,
        so a GET answer can be sent back.
      properties:
        enabled: { type: boolean, description: "Off: every order keeps the fee its writer set." }
        default_fee: { type: [integer, "null"], format: int64, minimum: 0, description: The flat fee, and the fee where no rate matches. }
        free_over: { type: [integer, "null"], format: int64, minimum: 1, description: Goods after the coupon at or above this ship free. }
        rates:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ShippingRate" }
        currency: { type: string, readOnly: true }
        minor_unit: { type: integer, readOnly: true }
        updated_at: { type: [string, "null"], format: date-time, readOnly: true }

    Shipping:
      type: object
      required: [enabled, default_fee, free_over, rates, currency, minor_unit, updated_at]
      properties:
        enabled: { type: boolean }
        default_fee: { type: [integer, "null"], format: int64 }
        free_over: { type: [integer, "null"], format: int64 }
        rates:
          type: array
          items: { $ref: "#/components/schemas/ShippingRate" }
        currency: { type: string }
        minor_unit: { type: integer, description: "Decimal digits of the unit: 0 for IRR (whole Rial)." }
        updated_at: { type: [string, "null"], format: date-time, description: Null until the rules are first saved. }

    ReplyLanguage:
      type: string
      enum: [en, ar, fa]
      description: Today's supported reply languages; an error's params.allowed lists them.

    Assistant:
      type: object
      required: [enabled, auto_reply, reply_language, persona_name, business_profile, updated_at]
      properties:
        enabled: { type: boolean }
        auto_reply: { type: boolean }
        reply_language: { $ref: "#/components/schemas/ReplyLanguage" }
        persona_name: { type: string }
        business_profile: { type: string }
        updated_at: { type: string, format: date-time }

    AssistantPut:
      type: object
      additionalProperties: false
      required: [enabled, auto_reply, reply_language]
      properties:
        enabled: { type: boolean, description: The master switch. }
        auto_reply: { type: boolean, description: Send without a human's approval. The assistant answers only while both are true. }
        reply_language: { type: string, description: "One of en, ar, fa; case and surrounding space ignored." }
        persona_name: { type: string, maxLength: 80, description: Omitted is left as it is. }
        business_profile: { type: string, maxLength: 4000, description: "Omitted is left as it is; \"\" clears it." }

    OrderStatus:
      type: string
      enum: [draft, confirmed, paid, packing, shipped, delivered, cancelled]
      x-extensible-enum: true
      description: "Extensible: a client must accept a value it does not know. paid is payment verified, waiting to be packed."

    PaymentStatus:
      type: string
      enum: [unpaid, pending_verification, rejected, paid]
      x-extensible-enum: true
      description: "Extensible: a client must accept a value it does not know. rejected means the last receipt was refused and none is pending. An order in paid, packing, shipped or delivered is always paid; paid is otherwise only on a cancelled order."

    MessageKind:
      type: string
      enum: [text, image, video, audio, document, sticker, other]

    OrderItem:
      type: object
      required: [title, quantity, unit_price, line_total]
      properties:
        title: { type: string, description: As at order time. }
        variant_name: { type: string, description: Left out when the line has none. }
        quantity: { type: integer }
        unit_price: { type: integer, format: int64 }
        line_total: { type: integer, format: int64 }

    OrderTotals:
      type: object
      required: [subtotal, total, currency, minor_unit]
      properties:
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64, description: Left out when zero. }
        shipping: { type: integer, format: int64, description: Left out when zero. }
        shipping_basis: { $ref: "#/components/schemas/ShippingBasis" }
        shipping_zone: { type: string, description: "The city or province whose rate set shipping (a place name); left out otherwise." }
        total: { type: integer, format: int64 }
        currency: { type: string }
        minor_unit: { type: integer, description: "Decimal digits of the unit: 0 for IRR (whole Rial)." }

    OrderCustomer:
      type: object
      required: [channel, conversation_id]
      properties:
        name: { type: string, description: The order's shipping-address name, else the customer's; left out when unknown. }
        phone: { type: string, description: The order's shipping-address phone, else the customer's; left out when unknown. }
        channel: { type: [string, "null"], description: "The customer's channel kind: instagram, whatsapp or telegram." }
        conversation_id: { type: [string, "null"], format: uuid }

    OrderPayment:
      type: object
      required: [method, status, receipt_received, pending_evidence, paid_at]
      properties:
        method: { const: card_to_card }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        receipt_received: { type: boolean, description: At least one payment receipt is attached; the receipts are at the payment-evidence routes. }
        pending_evidence: { type: integer, description: Receipts waiting for a decision. }
        paid_at: { type: [string, "null"], format: date-time }

    Order:
      type: object
      required: [id, code, status, source, created_at, updated_at, items, totals, customer, payment]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: The order number the seller and the customer see. }
        status: { $ref: "#/components/schemas/OrderStatus" }
        source: { type: string, enum: [dashboard, ai, api] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        totals: { $ref: "#/components/schemas/OrderTotals" }
        customer: { $ref: "#/components/schemas/OrderCustomer" }
        payment: { $ref: "#/components/schemas/OrderPayment" }
        confirmed_at: { type: [string, "null"], format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        packing_at: { type: [string, "null"], format: date-time }
        shipped_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }

    OrderList:
      type: object
      required: [orders, next_cursor]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        next_cursor: { type: [string, "null"] }

    OrderStatusMove:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [packing, shipped, delivered, cancelled] }

    PaymentRejectReason:
      type: string
      enum: [amount_mismatch, unreadable, not_received, wrong_destination, other]

    Evidence:
      type: object
      required: [id, order_id, kind, status, created_at, expected_amount, currency, minor_unit, decided_at, decided_by,
        reject_reason, note, closed_reason, has_content]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        kind: { type: string, enum: [image, text], x-extensible-enum: true }
        status: { type: string, enum: [pending_verification, approved, rejected, closed], x-extensible-enum: true }
        created_at: { type: string, format: date-time }
        expected_amount: { type: integer, format: int64, description: "The order's total when the receipt arrived, in the unit of the order totals." }
        currency: { type: string }
        minor_unit: { type: integer }
        decided_at: { type: [string, "null"], format: date-time }
        decided_by: { type: [string, "null"], enum: [user, partner_key, system, null], description: "The decider's kind, never who." }
        reject_reason:
          oneOf:
            - $ref: "#/components/schemas/PaymentRejectReason"
            - type: "null"
        note: { type: string, description: "The decider's internal note; never sent to the customer." }
        closed_reason: { type: [string, "null"], enum: [order_paid, order_cancelled, null] }
        has_content: { type: boolean, description: The content route has the receipt. }

    EvidenceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }

    EvidenceText:
      type: object
      required: [kind, text]
      properties:
        kind: { const: text }
        text: { type: string, description: The receipt as the customer typed it, at most 500 characters. }

    EvidenceDecision:
      type: object
      required: [order, evidence]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        evidence: { $ref: "#/components/schemas/Evidence" }

    EvidenceReject:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/PaymentRejectReason" }
        note: { type: string, maxLength: 500, description: Internal; never sent to the customer. }

    MarkPaid:
      type: object
      additionalProperties: false
      properties:
        reference: { type: string, maxLength: 64, description: "Internal, for example the bank's tracking number." }

    CaseKind:
      type: string
      enum: [return, exchange, refund, complaint, issue]

    CaseState:
      type: string
      enum: [open, awaiting_customer, accepted, rejected, refunded, exchanged, closed]

    RejectReason:
      type: string
      enum: [outside_window, condition_not_met, item_not_returnable, order_not_found, other]

    CaseCustomer:
      type: object
      required: [name, phone, channel, conversation_id]
      properties:
        name: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        channel: { type: [string, "null"], description: "The customer's channel kind: instagram, whatsapp or telegram." }
        conversation_id: { type: string, format: uuid }

    CaseRefund:
      type: object
      required: [amount, currency, minor_unit, reference]
      properties:
        amount: { type: [integer, "null"], format: int64, description: "As recorded by the shop, in the market's storage unit." }
        currency: { type: string }
        minor_unit: { type: integer }
        reference: { type: [string, "null"], maxLength: 64, description: "The bank transfer's reference, as recorded by the shop." }

    CasePhoto:
      type: object
      required: [id, content_type, bytes, created_at]
      properties:
        id: { type: string, format: uuid, description: "The {photo_id} of the photo download; not a media id." }
        content_type: { type: [string, "null"], description: "The stored type; null once the picture is gone." }
        bytes: { type: [integer, "null"], format: int64 }
        created_at: { type: string, format: date-time }

    CaseEvent:
      type: object
      required: [seq, action, actor, from_state, to_state, notice, occurred_at]
      properties:
        seq: { type: integer, minimum: 1 }
        action: { type: string, enum: [opened, photo_added, customer_replied, request_info, accept, reject, mark_refunded, mark_exchanged, close] }
        actor: { type: string, enum: [customer, assistant, partner, seller, system] }
        from_state: { oneOf: [{ $ref: "#/components/schemas/CaseState" }, { type: "null" }] }
        to_state: { $ref: "#/components/schemas/CaseState" }
        notice: { type: [string, "null"], enum: [sent, window_closed, blocked, failed, null], description: "The customer message's outcome; null when none was asked for or it is still pending." }
        occurred_at: { type: string, format: date-time }

    CaseSummary:
      type: object
      required: [id, code, kind, state, order, order_unresolved, days_since_ship, customer, reject_reason, refund, photo_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "The case code the customer was given, R followed by a number." }
        kind: { $ref: "#/components/schemas/CaseKind" }
        state: { $ref: "#/components/schemas/CaseState" }
        order:
          description: "Null when the customer named no order of their own (order_unresolved)."
          oneOf:
            - type: object
              required: [id, code]
              properties:
                id: { type: string, format: uuid }
                code: { type: [string, "null"] }
            - { type: "null" }
        order_unresolved: { type: boolean }
        days_since_ship: { type: [integer, "null"], description: "Days from shipping (else payment, else confirmation) to the case opening; null without an order." }
        customer: { $ref: "#/components/schemas/CaseCustomer" }
        reject_reason: { oneOf: [{ $ref: "#/components/schemas/RejectReason" }, { type: "null" }] }
        refund: { oneOf: [{ $ref: "#/components/schemas/CaseRefund" }, { type: "null" }], description: "Set only in state refunded." }
        photo_count: { type: integer, minimum: 0, maximum: 5 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Case:
      allOf:
        - $ref: "#/components/schemas/CaseSummary"
        - type: object
          required: [customer_text, note, photos, events]
          properties:
            customer_text: { type: string, maxLength: 2000, description: "What the customer wrote, as written." }
            note: { type: string, maxLength: 1000, description: "The shop's own note; never sent to the customer." }
            photos:
              type: array
              maxItems: 5
              items: { $ref: "#/components/schemas/CasePhoto" }
            events:
              type: array
              items: { $ref: "#/components/schemas/CaseEvent" }

    CaseList:
      type: object
      required: [cases, next_cursor]
      properties:
        cases:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        next_cursor: { type: [string, "null"] }

    HandoffState:
      type: string
      enum: [ai, handoff, human]
      description: "human while a person holds the thread (the assistant is off for it), else handoff while it waits for a person, else ai. The same definition as the webhooks."

    ChannelKind:
      type: string
      enum: [whatsapp, instagram, telegram]
      x-extensible-enum: true

    MessageMedia:
      type: object
      required: [id, mime, size, path]
      properties:
        id: { type: string, format: uuid }
        mime: { type: [string, "null"] }
        size: { type: [integer, "null"], format: int64 }
        path:
          type: string
          description: "The partner media route for this id (getInboxMedia: the partner key and inbox:media). Never a signed or public link."

    Message:
      type: object
      required: [id, conversation_id, direction, sender, kind, text, status, created_at, media]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        direction: { type: string, enum: [in, out] }
        sender: { type: string, enum: [customer, human, ai] }
        kind: { type: string, enum: [text, image, video, audio, document, sticker, other] }
        text: { type: string, description: "The body, or an attachment's caption." }
        status: { type: string, enum: [received, sent, delivered, read, failed] }
        created_at: { type: string, format: date-time, description: "The provider's timestamp, not the arrival order." }
        media: { oneOf: [{ $ref: "#/components/schemas/MessageMedia" }, { type: "null" }] }

    MessageList:
      type: object
      required: [messages, next_before, next_after]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        next_before: { type: [string, "null"], description: "Set while older messages exist; null on an after page." }
        next_after: { type: [string, "null"], description: "The page's newest message (on an empty after page, the cursor sent); null on a before page." }

    Conversation:
      type: object
      required: [id, channel_kind, status, state, handoff, held_since, customer, last_message, last_message_at,
        last_customer_message_at, reply_window_closes_at]
      properties:
        id: { type: string, format: uuid }
        channel_kind: { $ref: "#/components/schemas/ChannelKind" }
        status: { type: string, enum: [open, snoozed, closed] }
        state: { $ref: "#/components/schemas/HandoffState" }
        handoff:
          description: "Set only in state handoff."
          oneOf:
            - type: object
              required: [reason, raised_at]
              properties:
                reason: { type: [string, "null"] }
                raised_at: { type: [string, "null"], format: date-time }
                reason_class: { $ref: "#/components/schemas/HandoffClass" }
                priority: { $ref: "#/components/schemas/HandoffPriority" }
            - type: "null"
        held_since: { type: [string, "null"], format: date-time, description: "Set only in state human: when the assistant was switched off for the thread." }
        customer:
          type: object
          required: [id, display_name, phone]
          description: "Never the customer's platform id or handle."
          properties:
            id: { type: string, format: uuid }
            display_name: { type: [string, "null"] }
            phone: { type: [string, "null"] }
        last_message: { oneOf: [{ $ref: "#/components/schemas/Message" }, { type: "null" }] }
        last_message_at: { type: string, format: date-time }
        last_customer_message_at: { type: [string, "null"], format: date-time }
        reply_window_closes_at: { type: [string, "null"], format: date-time, description: "Instagram only: last_customer_message_at + 24 h; null elsewhere." }
        queue:
          allOf: [{ $ref: "#/components/schemas/HandoffQueue" }]
          description: "The queue the last raise routed the thread to, or a later move put it in. It stays after the handoff ends. Absent on a thread never handed off, and while v3.handoff.queues is off."
        intent:
          type: object
          required: [code, parent, at]
          description: "The assistant's last classified intent, codes only. Absent until one is recorded, and while v3.handoff.queues is off."
          properties:
            code: { type: string }
            parent: { type: [string, "null"] }
            at: { type: [string, "null"], format: date-time }
        related_order:
          type: object
          required: [id, code, status, payment_status]
          description: "The newest order written on this thread; read it in full with getOrder. Absent when there is none, and while v3.handoff.queues is off."
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            status: { $ref: "#/components/schemas/OrderStatus" }
            payment_status: { $ref: "#/components/schemas/PaymentStatus" }

    HandoffQueue:
      type: string
      enum: [sales, support, accounting, appointment, fulfillment]
      x-extensible-enum: true

    HandoffPriority:
      type: string
      enum: [low, normal, high, urgent]
      x-extensible-enum: true
      description: "Absent while v3.handoff.queues is off."

    HandoffClass:
      type: string
      enum: [PAYMENT_VERIFICATION, POLICY_REQUIRED, CLARIFICATION_EXHAUSTED, INTEGRATION_FAILURE, EXPLICIT_HUMAN_REQUEST,
        HIGH_RISK_LOW_CONFIDENCE, SYSTEM_FAILURE, NONE]
      x-extensible-enum: true
      description: "Why the handoff needs a person, as a class of the reason. Absent while v3.handoff.queues is off."

    QueueMoveRequest:
      type: object
      additionalProperties: false
      required: [queue]
      properties:
        queue: { type: string, enum: [sales, support, accounting, appointment, fulfillment] }

    ConversationList:
      type: object
      required: [conversations, next_cursor]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        next_cursor: { type: [string, "null"] }

    ReplyRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [text]
        - required: [media_id]
      properties:
        text: { type: string, minLength: 1, description: "Human-typed text, trimmed; at most 1000 characters on Instagram, 4096 elsewhere. Not with media_id." }
        media_id: { type: string, format: uuid, description: "An image uploadInboxMedia stored for this business, sent as one photo (WhatsApp and Telegram)." }
        caption: { type: string, maxLength: 1024, description: "The photo's caption, trimmed; only with media_id." }
        agent_ref: { type: string, maxLength: 64, pattern: "^[!-~]*$", description: "Your seat or agent id, printable ASCII; kept in the audit row only." }

    UploadedMedia:
      type: object
      required: [id, mime, size]
      properties:
        id: { type: string, format: uuid }
        mime: { type: string, enum: [image/jpeg, image/png] }
        size: { type: integer, format: int64 }

    OnboardingJobRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        on_errors: { type: string, enum: [skip, abort], default: skip, description: "skip commits the valid rows; abort refuses the commit while any row failed." }
        auto_commit: { type: boolean, default: false }
        defaults:
          type: object
          additionalProperties: false
          description: "Fills a row's blank market_profile, reply_language and owner.locale."
          properties:
            market_profile: { type: string }
            reply_language: { type: string }
            owner_locale: { type: string }
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: object
            additionalProperties: false
            description: "A createTenant body; the owner may give first_name and last_name instead of display_name."
            properties:
              external_business_id: { type: string, minLength: 1, maxLength: 128 }
              name: { type: string, maxLength: 200 }
              reply_language: { type: string }
              market_profile: { type: string }
              metadata: { type: object, description: "At most 8 KiB." }
              owner:
                type: object
                additionalProperties: false
                properties:
                  external_user_id: { type: string, maxLength: 128 }
                  email: { type: string, format: email }
                  display_name: { type: string, maxLength: 200 }
                  first_name: { type: string }
                  last_name: { type: string }
                  locale: { type: string }
                  phone: { type: string }

    OnboardingCounts:
      type: object
      required: [rows, valid, will_create, will_update, unchanged, failed]
      properties:
        rows: { type: integer }
        valid: { type: integer }
        will_create: { type: integer }
        will_update: { type: integer }
        unchanged: { type: integer }
        failed: { type: integer }

    OnboardingJob:
      type: object
      required: [id, kind, status, format, filename, on_errors, tenant, counts, result, error, warnings, created_at, committed_at, finished_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [tenants], x-extensible-enum: true }
        status: { type: string, enum: [ready, committing, done, error, expired, cancelled], x-extensible-enum: true }
        format: { type: string, enum: [csv, xlsx, json] }
        filename: { type: string, description: "The uploaded file's name; empty for JSON rows." }
        on_errors: { type: string, enum: [skip, abort] }
        tenant: { type: "null", description: "Always null for a business job." }
        counts: { $ref: "#/components/schemas/OnboardingCounts" }
        result:
          type: [object, "null"]
          description: "Set once the job is done or error."
          required: [created, updated, unchanged, failed, not_attempted]
          properties:
            created: { type: integer }
            updated: { type: integer }
            unchanged: { type: integer }
            failed: { type: integer }
            not_attempted: { type: integer }
        error: { type: [string, "null"], description: "`commit_interrupted` when the commit could not be carried on; the businesses provisioned before stand." }
        warnings:
          type: array
          items:
            type: object
            required: [code, line, params]
            properties:
              code: { type: string, description: "e.g. sheet_ignored, formula_cached_value, merged_cells, rows_truncated" }
              line: { type: integer }
              params: { type: object }
        created_at: { type: string, format: date-time }
        committed_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }

    OnboardingRowError:
      type: object
      required: [code, params, message]
      properties:
        code:
          type: string
          x-extensible-enum: true
          enum: [required_missing, too_long, invalid_value, invalid_email, invalid_phone, market_profile_invalid,
            reply_language_invalid, locale_invalid, metadata_invalid, external_id_invalid, duplicate_in_file,
            owner_email_duplicate_in_file, owner_email_in_use, owner_mismatch, owner_external_id_in_use,
            entitlement_exceeded, quota_exceeded, id_precision_lost, formula_no_value, row_unreadable, write_failed]
        column: { type: string, description: "The canonical file column." }
        field: { type: string, description: "The createTenant body field." }
        params: { type: object }
        message: { type: string, description: "English; render from code." }

    OnboardingRow:
      type: object
      required: [line, external_id, name, action, errors, tenant_id, owner_status]
      properties:
        line: { type: integer, description: "The file line (the sheet row), or the 1-based index of a JSON row." }
        external_id: { type: string }
        name: { type: string }
        action: { type: string, enum: [create, unchanged, fail, not_attempted], x-extensible-enum: true }
        errors:
          type: array
          items: { $ref: "#/components/schemas/OnboardingRowError" }
        tenant_id: { type: [string, "null"], format: uuid }
        owner_status: { type: [string, "null"], enum: [pending, active, null] }

    CatalogImportJobRequest:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        on_errors: { type: string, enum: [skip, abort], default: skip, description: "skip commits the valid products; abort refuses the commit while any product failed." }
        auto_commit: { type: boolean, default: false }
        rows:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            description: "A putProduct body plus the product's external_id."
            required: [external_id, title, active, variants]
            properties:
              external_id: { type: string, minLength: 1, maxLength: 128 }
              title: { type: string, minLength: 1, maxLength: 200 }
              description: { type: string, maxLength: 4000 }
              category: { type: string }
              sku: { type: string, maxLength: 64 }
              active: { type: boolean }
              variants:
                type: array
                minItems: 1
                maxItems: 200
                items: { $ref: "#/components/schemas/VariantPut" }

    CatalogImportJob:
      type: object
      required: [id, kind, status, format, filename, on_errors, tenant, counts, result, error, warnings, created_at, committed_at, finished_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [products], x-extensible-enum: true }
        status: { type: string, enum: [ready, committing, done, error, expired, cancelled], x-extensible-enum: true }
        format: { type: string, enum: [csv, xlsx, json] }
        filename: { type: string, description: "The uploaded file's name; empty for JSON rows." }
        on_errors: { type: string, enum: [skip, abort] }
        tenant:
          type: object
          required: [external_business_id]
          properties:
            external_business_id: { type: string }
        counts:
          allOf:
            - $ref: "#/components/schemas/OnboardingCounts"
          description: "Products, not file lines; unchanged is always 0."
        result:
          type: [object, "null"]
          description: "Set once the job is done or error."
          required: [created, updated, unchanged, failed, not_attempted]
          properties:
            created: { type: integer }
            updated: { type: integer }
            unchanged: { type: integer }
            failed: { type: integer }
            not_attempted: { type: integer }
        error: { type: [string, "null"], description: "`market_changed` (nothing written) or `commit_interrupted` (the products written before stand)." }
        warnings:
          type: array
          items:
            type: object
            required: [code, line, params]
            properties:
              code: { type: string, description: "e.g. sheet_ignored, formula_cached_value, merged_cells, rows_truncated, image_skipped, price_unit_mismatch (params.column, unit, expected: a price column refused, never converted)" }
              line: { type: integer }
              params: { type: object }
        created_at: { type: string, format: date-time }
        committed_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }

    CatalogImportRowError:
      type: object
      required: [code, params, message]
      properties:
        line: { type: integer, description: "The file line at fault, when the product spans several." }
        code:
          type: string
          x-extensible-enum: true
          enum: [required_missing, too_long, invalid_value, external_id_invalid, duplicate_in_file, entitlement_exceeded,
            id_precision_lost, formula_no_value, price_invalid, price_not_integral, price_negative, stock_invalid,
            variant_external_id_taken, title_missing, row_unreadable, write_failed]
        column: { type: string, description: "The file column as the file wrote it, or the canonical id column." }
        field: { type: string }
        params: { type: object }
        message: { type: string, description: "English; render from code." }

    CatalogImportRow:
      type: object
      required: [line, lines, external_id, title, action, errors, warnings, product_id, variant_ids]
      properties:
        line: { type: integer, description: "The product's first file line, or the 1-based index of a JSON row." }
        lines: { type: array, items: { type: integer }, description: "Every file line of the product, in file order." }
        external_id: { type: string }
        title: { type: string }
        action: { type: string, enum: [create, update, fail, not_attempted], x-extensible-enum: true }
        errors:
          type: array
          items: { $ref: "#/components/schemas/CatalogImportRowError" }
        warnings:
          type: array
          items: { type: string }
          description: "Codes of what failed after the product was written: image_failed, image_skipped, knowledge_failed."
        product_id: { type: [string, "null"], format: uuid }
        variant_ids: { type: array, items: { type: string, format: uuid }, description: "The variants' ids, in the product's variant order." }

    SentNotSaved:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [sent_not_saved] }

    ReleasedConversation:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [assistant_active]
          properties:
            assistant_active: { type: boolean, description: "The business's assistant is enabled with auto-reply on." }

    CaseAction:
      type: object
      additionalProperties: false
      required: [action, expected_state]
      properties:
        action: { type: string, enum: [request_info, accept, reject, mark_refunded, mark_exchanged, close] }
        expected_state: { $ref: "#/components/schemas/CaseState" }
        reject_reason: { $ref: "#/components/schemas/RejectReason", description: "Required for reject; refused otherwise." }
        refund:
          type: object
          additionalProperties: false
          description: "mark_refunded only; both fields optional."
          properties:
            amount: { type: integer, format: int64, minimum: 0, description: "At most the linked order's total." }
            reference: { type: string, maxLength: 64 }
        note: { type: string, maxLength: 1000, description: "Kept as the case's note when not blank; never sent to the customer." }
        notify_customer: { type: boolean, default: true }

    ReturnPolicy:
      type: object
      required: [enabled, window_days, conditions, updated_at]
      properties:
        enabled: { type: boolean }
        window_days: { type: [integer, "null"], minimum: 0, maximum: 365 }
        conditions: { type: string, maxLength: 1500 }
        updated_at: { type: string, format: date-time }

    ReturnPolicyPut:
      type: object
      additionalProperties: false
      description: "An enabled policy states window_days, conditions or both."
      properties:
        enabled: { type: boolean, default: true }
        window_days: { type: [integer, "null"], minimum: 0, maximum: 365, description: "Omitted or null states no window." }
        conditions: { type: string, maxLength: 1500, description: "Trimmed; omitted is empty." }

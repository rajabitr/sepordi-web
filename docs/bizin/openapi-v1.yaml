        One brand per partner, always the key's own. `mode` is set by Bizin support: `direct` shows Bizin, `partner`
        your name and logo, `co_brand` both with "Powered by Bizin", on the screens a seller sees (the connect and
        activation pages and the panel). A customer never sees your brand: the assistant speaks as the business.
        `disclosures` always has `en`, `ar` and `fa`: the AI disclosure a business of yours sends while the mode is
        `partner` or `co_brand`, either your text (`source: brand`) or Bizin's default (`source: default`). The
        disclosure is always sent; no setting turns it off.
      x-scope: "branding:read"
      responses:
        "200":
          description: The brand
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
              example:
                mode: partner
                names: { en: ShopKit, ar: "شوب كيت", fa: "شاپ‌کیت" }
                support_label: { en: ShopKit support, ar: "دعم شوب كيت", fa: "پشتیبانی شاپ‌کیت" }
                support_url: https://help.shopkit.example
                logo_url: https://www.bizin.app/api/v1/brand-assets/5b0d6a3e-7c1f-4f2b-9a51-2f0e8d7c6b5a
                disclosures:
                  en: { text: "…", source: brand }
                  ar: { text: "…", source: default }
                  fa: { text: "…", source: default }
                updated_at: "2026-10-18T09:30:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: putBranding
      tags: [branding]
      summary: Set your brand's names, support label and support URL
      description: |
        A member the body leaves out keeps its value; `null` clears it, and `names` or `support_label` replaces the
        whole object. `mode` is Bizin support's: a body that names it is 400 `brand_mode_read_only`. The logo has its
        own operation and each disclosure its own. Every change is written in each of your businesses' activity logs
        (`partner.brand_updated`, data.fields names what changed) before it is made; a save that changes nothing
        writes nothing. The businesses' screens show the change at once.
      x-scope: "branding:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandingPut" }
            example:
              names: { en: ShopKit, fa: "شاپ‌کیت" }
              support_url: https://help.shopkit.example
      responses:
        "200":
          description: The brand after the write
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400":
          description: "`bad_request_body` (also an empty body or an unknown member such as `enabled`), or `brand_mode_read_only` (field: mode)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`invalid_value` with field `names.<locale>` or `support_label.<locale>` (en, ar or fa; 1-60 characters), or `support_url` (https, at most 500 characters)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /branding/disclosures/{locale}:
    parameters:
      - $ref: "#/components/parameters/Locale"
    put:
      operationId: putBrandDisclosure
      tags: [branding]
      summary: Set your AI disclosure in one language, or go back to Bizin's default
      description: |
        `{"text": "..."}` stores your text, trimmed; `{"text": null}` drops it, so Bizin's default is sent. A text is
        accepted only when it is a disclosure in that language: 20-220 characters, it says the replies are automated
        and offers a person, it is written in the language's script (Arabic script for `fa` and `ar`, Latin for
        `en`), and it names a word that a customer can type to reach a person, which the assistant then honours. The
        same check runs again on every send, and a text that fails it there is replaced by the default. There is no
        way to switch the disclosure off: a body with any other member (for example `enabled`) is 400. Each change is
        written in each of your businesses' activity logs (`partner.brand_disclosure_set`, data.locale, data.from and
        data.to: `default` or `brand`, never the text).
      x-scope: "branding:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisclosurePut" }
            example:
              text: "پاسخ‌ها را دستیار هوش مصنوعی شاپ‌کیت می‌فرستد؛ برای گفتگو با همکاران ما بنویسید «اپراتور»."
      responses:
        "200":
          description: The brand after the write
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400":
          description: "`bad_request_body`: no `text` member, a `text` that is neither a string nor null, or an unknown member"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`not_found`: the locale is not en, ar or fa"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`disclosure_invalid`: params.reason says which rule the text breaks, params.locale names the language"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisclosureInvalid" }
              example:
                error: disclosure_invalid
                code: disclosure_invalid
                message: this text is not an AI disclosure in its locale
                params: { reason: wrong_script, locale: fa }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /branding/logo:
    post:
      operationId: uploadBrandLogo
      tags: [branding]
      summary: Set your logo
      description: |
        multipart/form-data with one file field `file`: a PNG or WebP image of at most 256 KiB and 512×512 pixels. The
        type is read from the bytes; SVG is refused. What is stored and served is Bizin's own PNG re-encode of the
        pixels, never your bytes, under a new id each time (`logo_url`, public and cached for a year). A logo holds
        no business data. Needs an Idempotency-Key, but a multipart body is not stored for replay: a retry under the
        same key uploads again. Each upload is written in each of your businesses' activity logs
        (`partner.brand_updated`, data.fields `[logo]`).
      x-scope: "branding:write"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: The brand with its new logo
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400":
          description: "`bad_multipart` (params.field, params.max_mb), `file_field_missing` (params.field), `image_empty`, `idempotency_key_required` or `idempotency_key_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: "`file_too_large` (the upload is over 256 KiB) or `logo_too_large` (params.max_kb: its re-encode is)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "`logo_type_unsupported`: only PNG and WebP; SVG is refused"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`logo_too_wide` (params.max_px) or `logo_invalid` (the bytes do not decode as one still image)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }


  /tenants/{ext}/shipping:
    parameters:
      - $ref: "#/components/parameters/Ext"
    get:
      operationId: getShipping
      tags: [shipping]
      summary: The postage rules every checkout prices from
      x-scope: shipping:read
      x-feature: shipping.rules
      responses:
        "200":
          description: The rules; a business that never saved any reads as disabled with no rates
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipping" }
              example:
                enabled: true
                default_fee: 600000
                free_over: 30000000
                rates:
                  - { province: "تهران", fee: 400000 }
                  - { province: "فارس", city: "شیراز", fee: 700000 }
                  - { province: "فارس", fee: 800000 }
                currency: IRR
                minor_unit: 0
                updated_at: "2026-10-14T09:00:00Z"
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: putShipping
      tags: [shipping]
      summary: Replace the postage rules; audited with the key as actor
      description: |
        No Idempotency-Key: the body is the whole rule set, and a save that changes nothing writes nothing and is not
        audited. The audit row keeps the enabled flag and the rate counts, not the table. A checkout the customer
        accepted under the old rules goes stale and is priced again before the seller confirms it. Rates need the
        market's place list (ir); elsewhere only default_fee and free_over apply.
      x-scope: shipping:write
      x-feature: shipping.rules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingPut" }
            example:
              enabled: true
              default_fee: 600000
              free_over: 30000000
              rates:
                - { province: Tehran, fee: 400000 }
                - { province: Fars, city: Shiraz, fee: 700000 }
      responses:
        "200":
          description: The stored rules, with place names as stored
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipping" }
        "400":
          description: "`bad_request_body` (a fractional amount too) or `external_business_id_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "422":
          description: |
            `invalid_value` with the first failing field: default_fee, free_over, rates (over 500, or a market with no
            place list), rates[i].province (unknown), rates[i].city (not a city of that province), rates[i].fee, rates[i]
            (same province and city as an earlier rate), or enabled (on with neither default_fee nor a rate). A fee must
            be a whole quote unit (a multiple of 10 for IRR).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }


          description: The case
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
              example:
                id: 6f1c2a8b-9d10-4c55-9e0b-6d3c0e7a4f71
                code: R12
                kind: return
                state: open
                order: { id: 9b3f6e12-4d8a-4c71-a0e5-2f7b1c9d3e68, code: "1043" }
                order_unresolved: false
                days_since_ship: 4
                customer: { name: Reza, phone: "09121234567", channel: whatsapp, conversation_id: c7e2a9f4-1b3d-4e5f-8a6b-9c0d1e2f3a4b }
                reject_reason: null
                refund: null
                photo_count: 1
                created_at: "2026-10-14T09:12:00Z"
                updated_at: "2026-10-14T09:15:30Z"
                customer_text: The shoes are one size too small.
                note: ""
                photos:
                  - { id: 3a4b5c6d-7e8f-4a1b-9c2d-0e1f2a3b4c5d, content_type: image/jpeg, bytes: 182311, created_at: "2026-10-14T09:15:30Z" }
                events:
                  - { seq: 1, action: opened, actor: assistant, from_state: null, to_state: open, notice: null, occurred_at: "2026-10-14T09:12:00Z" }
                  - { seq: 2, action: photo_added, actor: customer, from_state: open, to_state: open, notice: null, occurred_at: "2026-10-14T09:15:30Z" }
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

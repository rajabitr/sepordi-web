  /tenants/{ext}/conversations/{conversation_id}/reply:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/ConversationID"
    post:
      operationId: replyToConversation
      tags: [inbox]
      summary: Send a human-typed text reply, or an uploaded image, on the conversation's channel
      description: |
        For text a person typed, never generated text (contract clause): the reply is stored as sender `human`,
        is not checked against the catalog the way the assistant's replies are, and keeps the assistant quiet for
        the business's takeover window. Either `text`, or `media_id` (an image uploadInboxMedia stored for this
        business) with an optional `caption` of at most 1024 characters: the customer gets one photo and the
        stored message is kind `image` with `media`. Images go on WhatsApp and Telegram; on Instagram an image
        answers 409 `image_not_supported_on_channel` and nothing is sent. There is no cold outreach: the conversation must exist and hold
        at least one customer message, otherwise 409 `no_customer_message` and nothing is sent. The panel's
        assignee rule does not apply; the key's scope is the authority. Needs an Idempotency-Key: a reply that
        reached the customer always answers 2xx, and a retry under the same key replays that answer without
        sending again. 202 `sent_not_saved` means the customer has the message but Bizin could not store it: do
        not resend. WhatsApp pacing can hold the request up to 20 s; use a client timeout of at least 30 s. 429
        `send_rate_limited` is the channel's budget or the platform's own limit, not the API's `rate_limited`.
        Audited as `partner.inbox_reply_sent` with the key as actor (data.media_id for an image); neither the text
        nor the caption is in any audit row.
      x-scope: "inbox:write"
      x-feature: inbox.api
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplyRequest" }
            examples:
              text:
                value: { text: "بله موجوده، ارسالش فردا انجام میشه.", agent_ref: "seat-12" }
              image:
                value: { media_id: "9a0f6c2e-3b1d-4c55-8e0a-2f6b7d1c4e90", caption: "این همون مدله", agent_ref: "seat-12" }
      responses:
        "201":
          description: The stored message, as GET reads it
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "202":
          description: Sent to the customer, not stored; never resend
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentNotSaved" }
        "400":
          description: "`text_required`, `text_too_long` (params.max: Instagram 1000, others 4096; a caption 1024), `bad_request_body`, `external_business_id_invalid`, `idempotency_key_required` or `idempotency_key_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `conversation_not_found` (not a uuid or not this business's), `media_not_found` (not a uuid, or no media of this business has the id), or `not_found` (inbox switched off)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`no_customer_message`, `channel_not_connected`, `window_closed` (the channel's reply window; params.last_customer_message_at, params.closed_at when known), `image_not_supported_on_channel` (Instagram), `recipient_refused` (the customer blocked the bot), `send_paused` (paused_until, pause_reason), `conversation_busy`, `idempotency_request_in_progress` or `idempotency_replay_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          description: "`image_type_unsupported`: the media is not a JPEG or PNG image"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_value` (field agent_ref; field text when media_id is set; field caption without media_id), `image_undecodable` (the image could not be prepared for the channel) or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`send_rate_limited` (retry_after_seconds; the channel) or `rate_limited` (the API bucket); both with Retry-After"
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502":
          description: "`send_failed`: nothing reached the customer"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`idempotency_unavailable`, or `media_unavailable` (an image reply on a server without media storage)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }


        "202":
          description: The job, committing
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409":
          description: "`job_not_ready` (committing, finished, cancelled or expired; a second commit lands here), `job_has_row_errors` (an `abort` job with failed rows), or an idempotency conflict"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

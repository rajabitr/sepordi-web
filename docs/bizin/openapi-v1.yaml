  /tenants/{ext}/products/{product_ext}:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/ProductExt"
    put:
      operationId: putProduct
      tags: [catalog]
      summary: Create or replace a product and its variants by the partner's ids
      description: |
        No Idempotency-Key: the body replaces the product. The variant list is authoritative: a stored variant missing
        from it is deactivated, never deleted; one sent again is reactivated. A `stock` number sets the counted level
        to exactly that value; null or absent stops counting. Prices are integers in the market's storage unit
        (`currency`, `price_exponent`: IRR 0, whole Rial).
      x-scope: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductPut" }
            example:
              title: Classic T-shirt
              description: 100% cotton
              category: Clothing
              sku: TS-001
              active: true
              variants:
                - { external_id: tee-classic-m-black, options: [M, Black], price: 12500000, stock: 14 }
                - { external_id: tee-classic-gift, title: Gift wrap, price: 13000000 }
      responses:
        "200":
          description: Replaced (created false)
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "201":
          description: Created (created true)
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
              example:
                id: 4c8e1a27-9b3d-4f60-a5e2-1d7c9f3b8e04
                external_id: tee-classic
                title: Classic T-shirt
                description: 100% cotton
                category: Clothing
                sku: TS-001
                active: true
                currency: IRR
                price_exponent: 0
                variants:
                  - { id: e2b7c4a1-5d3f-4b8e-9a06-1c2d3e4f5a6b, external_id: tee-classic-m-black, title: M / Black, price: 12500000, stock: 14, active: true }
                  - { id: 0a9d1e2f-3b4c-4d5e-8f6a-7b8c9d0e1f2a, external_id: tee-classic-gift, title: Gift wrap, price: 13000000, stock: null, active: true }
                created_at: "2026-10-13T11:20:05Z"
                updated_at: "2026-10-13T11:20:05Z"
                created: true
        "400":
          description: "`bad_request_body` (over 256 KiB too), `invalid_value` (field product_external_id), or `external_business_id_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "409":
          description: "`sku_taken` or `variant_external_id_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_value`: with field for active, variants, variants[i].price, variants[i].title and variants[i].options; the catalog's own rules (title, lengths, price ceiling, variant count, duplicate variant id) without field"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: getProduct
      tags: [catalog]
      summary: One product by the partner's id, with every variant and its live stock
      x-scope: catalog:read
      responses:
        "200":
          description: The product
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: "`invalid_value` (field product_external_id) or `external_business_id_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `product_not_found`, or `not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteProduct
      tags: [catalog]
      summary: Archive a product (the same as a PUT with active false); it stays readable
      x-scope: catalog:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Archived, also when it already was
          headers: *rateLimitHeaders
        "400":
          description: "`invalid_value` (field product_external_id), `external_business_id_invalid`, or an Idempotency-Key error"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `product_not_found`, or `not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }


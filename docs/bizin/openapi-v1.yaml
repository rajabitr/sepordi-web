        - name: payment_status
          in: query
          schema: { $ref: "#/components/schemas/PaymentStatus" }
          description: "pending_verification is the verification queue. Any other value is 400 `invalid_value` (field payment_status, params.allowed)."
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }


  /tenants/{ext}/catalog-import-jobs:
    parameters:
      - $ref: "#/components/parameters/Ext"
    post:
      operationId: createCatalogImportJob
      tags: [catalog]
      summary: Preview a file or JSON list of products as one catalogue job of this business
      description: |
        Either `multipart/form-data` (a `file` of CSV or XLSX, read by its bytes, at most 10 MiB and 64 MiB inflated,
        plus optional form fields `on_errors` and `auto_commit`) or `application/json` (at most 1 MiB). A JSON row is a
        putProduct body plus its `external_id`; a file row is one variant, and rows sharing an `external_id` are one
        product, its variants in file order. A file's prices are read in the business's market (IRR: Rial, or a
        Toman column); a JSON row's in the market's storage unit, as putProduct's. At most 5000 file lines or 5000
        JSON rows. Nothing is written: every product is judged as putProduct judges its body, and the business's
        existing external ids are read (`create` or `update`); the job answers `ready` with the counts. The columns
        and their aliases are in docs/backend/partner-api.md.

        Idempotent by job, as createOnboardingJob: the Idempotency-Key is bound to the content and the parameters
        (`format`, `on_errors`, `auto_commit`); the same key with the same request answers the existing job, 200; with
        another file, other parameters or on another business 422 `idempotency_key_reused`. `auto_commit: true` starts
        the commit at once, except for an `abort` job with failed products. A job not committed within 24 h expires.
        404 `not_found` while v3.partner.bulk_jobs is off.
      x-scope: catalog:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogImportJobRequest" }
            example:
              on_errors: skip
              auto_commit: true
              rows:
                - external_id: tee-classic
                  title: Classic T-shirt
                  sku: TS-001
                  active: true
                  variants:
                    - { external_id: tee-classic-m-black, options: [M, Black], price: 12500000, stock: 14 }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "CSV (UTF-8) or XLSX; the first visible sheet is read." }
                on_errors: { type: string, enum: [skip, abort], default: skip }
                auto_commit: { type: string, enum: ["true", "false"], default: "false" }
      responses:
        "201":
          description: The previewed job (or `committing` with auto_commit)
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImportJob" }
        "200":
          description: The job this Idempotency-Key already names, as it is now
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImportJob" }
        "400":
          description: "`bad_request_body`, `bad_multipart` (params.field, params.max_mb), `file_field_missing`, `file_unreadable`, `invalid_value` (field auto_commit), `external_business_id_invalid`, `idempotency_key_required` or `idempotency_key_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "413":
          description: "`file_too_large` (params.max_mb) or `idempotency_body_too_large` (params.max_mb)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "`file_format_unsupported` (an XLSX while workbooks are not read) or `file_xls_or_encrypted`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`columns_missing` (params.columns: external_id, variant_external_id), `file_too_large_uncompressed`, `file_unreadable`, `import_file_invalid` (no title or price column), `price_unit_mismatch` (the only price column names another unit than the shop reads prices in: params.column, params.unit, params.expected — irr, toman, aed or usd), `too_many_rows` (params.max), `rows_missing`, `invalid_value` (field on_errors, params.allowed) or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listCatalogImportJobs
      tags: [catalog]
      summary: This business's catalogue jobs, newest first
      description: Products and per-product results are left out; read them with listCatalogImportJobRows.
      x-scope: catalog:read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: object
                required: [jobs, next_cursor]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogImportJob" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }

      - $ref: "#/components/parameters/OrderID"
      - $ref: "#/components/parameters/EvidenceID"
    post:
      operationId: rejectPaymentEvidence
      tags: [payments]
      summary: Refuse a receipt with a reason code; the order stays confirmed
      description: |
        The customer is told the reason as a fixed sentence; `note` stays inside Bizin and your reads. The order's
        payment status becomes rejected when no other receipt is pending. Rejecting a rejected receipt answers 200
        and writes nothing, whatever reason the repeat names. `reason` is checked before the business is looked up.
        Audited with the key as the actor. While payment verification is off the answer is 409
        `payment_verification_off`.
      x-scope: "payments:verify"
      x-feature: payments.verification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceReject" }
            example: { reason: amount_mismatch, note: "Short by 100000 Rial." }
      responses:
        "200":
          description: The order and the receipt after the decision
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceDecision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EvidenceNotFound" }
        "409": { $ref: "#/components/responses/PaymentConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: "`invalid_value` (field reason or note) or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/orders/{order_id}/mark-paid:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/OrderID"
    post:
      operationId: markOrderPaid
      tags: [payments]
      summary: Record a payment seen without a receipt to approve; the order is paid
      description: |
        The order must be confirmed; a paid order answers 200 and writes nothing. Every pending receipt is closed
        (`closed_reason` order_paid) and the customer is told once. `reference` (at most 64 characters) is
        internal. Audited with the key as the actor. While payment verification is off the answer is 409
        `payment_verification_off`.
      x-scope: "payments:verify"
      x-feature: payments.verification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkPaid" }
      responses:
        "200":
          description: The order, as GET reads it
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `order_not_found`, or `not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/PaymentConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: "`invalid_value` (field reference) or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/orders/{order_id}/status:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/OrderID"
    post:
      operationId: setOrderStatus
      tags: [orders]
      summary: A fulfilment move (packing, shipped, delivered) or a cancellation; audited with the key as the actor
      description: |
        The moves are paid to packing, paid or packing to shipped, shipped to delivered, and draft, confirmed, paid
        or packing to cancelled. Stock follows the move as in the panel: shipping turns the reservation into a sale,
        cancelling releases it. `paid` is not a status move here (422 `invalid_value`): use mark-paid or approve a
        receipt. Any other move is 409 `invalid_transition`. The body is checked before the business is looked up.
        Payment verification being off does not affect this route.
      x-scope: "orders:fulfil"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusMove" }
            example: { status: shipped }
      responses:
        "200":
          description: The order, as GET reads it
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `order_not_found`, or `not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`invalid_transition` (params.from, params.to, params.allowed), `idempotency_request_in_progress` or `idempotency_replay_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: "`invalid_value` (field status, params.allowed) or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/cases:

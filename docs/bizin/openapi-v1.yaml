  /onboarding-jobs/{job_id}/commit:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: commitOnboardingJob
      tags: [onboarding]
      summary: Provision the job's businesses in the background
      description: |
        Starts the commit and answers at once with the job `committing`; poll getOnboardingJob until `done` or
        `error`, or subscribe a webhook to `import.completed`, sent once when the job ends. Each valid row is provisioned in a transaction of its own exactly as createTenant would (the same
        quota, cap, replay and audit row, which names the job); rows the preview failed are never written. A row
        past the daily quota or the tenant cap fails `quota_exceeded` / `entitlement_exceeded` and a rerun of the
        same file next day finishes the rest (`unchanged` for those already done). A commit cut short by a restart
        carries on from where it stopped. A job already committing finishes even if v3.partner.bulk_jobs is
        switched off.
      x-scope: tenants:provision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"

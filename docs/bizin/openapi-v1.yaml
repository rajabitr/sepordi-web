              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/conversations/{conversation_id}/queue:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/ConversationID"
    post:
      operationId: moveConversationQueue
      tags: [inbox]
      summary: Put a handed-off or held thread in another queue
      description: |
        Bizin routes every handoff to one of five fixed queues when it is raised (the reason decides; the queue,
        reason_class and priority are on the conversation object). This moves a thread in state handoff or human
        by hand. The move changes nothing else: not the state, not the handoff, not the takeover. It sends nothing
        to the customer and emits no webhook. It lasts until the next raise with a new reason, or the next raise
        after the handoff ended, which routes again; a raise with the same reason on a thread still waiting keeps
        the move. A move to the queue already set answers 200 and is not audited. Needs an Idempotency-Key.
        Audited as `partner.conversation_queue_changed` (data.conversation_id, data.from, data.to). 404
        `not_found` while v3.handoff.queues or the inbox is off.
      x-scope: "inbox:write"
      x-feature: inbox.api
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueMoveRequest" }
            example: { queue: accounting }
      responses:
        "200":
          description: The conversation in its new queue
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400":
          description: "`bad_request_body`, `external_business_id_invalid`, `idempotency_key_required` or `idempotency_key_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `conversation_not_found` (not a uuid or not this business's), or `not_found` (queues or the inbox switched off)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`conversation_not_handed_off` (state ai: nothing to route), `idempotency_request_in_progress` or `idempotency_replay_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_value` (field queue, params.allowed: the five queues) or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/media:
    parameters:
      - $ref: "#/components/parameters/Ext"
    post:
      operationId: uploadInboxMedia
      tags: [inbox]
      summary: Store an image for a reply
      description: |
        multipart/form-data with one file field `file`: a JPEG or PNG within the image cap (8 MiB by default). The
        type is read from the bytes (the part's Content-Type counts only when the bytes say nothing), and both the
        type and the size are checked before anything is stored: a refused upload stores nothing. Send the answered
        `id` as `media_id` in replyToConversation. The file belongs to this business only; it is served by
        getInboxMedia once a message carries it. Storage is by content: the same bytes for the same business are
        the same id, so a retry is safe. Needs an Idempotency-Key, but a multipart body is not stored for replay:
        a retry under the same key runs again, stores nothing new and answers the same id. Each upload is audited as
        `partner.media_uploaded` (data.mime, data.size). 404 `not_found` while the inbox is switched off.
      x-scope: "inbox:write"
      x-feature: inbox.api
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The stored image
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedMedia" }
        "400":
          description: "`bad_multipart` (params.field, params.max_mb), `file_field_missing` (params.field), `image_empty`, `external_business_id_invalid`, `idempotency_key_required` or `idempotency_key_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "413":
          description: "`file_too_large` (params.max_mb)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "`image_type_unsupported`: only JPEG and PNG are sent as photos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: "`media_unavailable` (no media storage), `media_store_unavailable` (Retry-After: 5) or `idempotency_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tenants/{ext}/media/{media_id}:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/MediaID"
    get:
      operationId: getInboxMedia
      tags: [inbox]
      summary: The bytes of a file a message of this shop carries (photos, voice notes, documents, bank receipts)
      description: |
        The `media.path` of a message. Only a file some message of this shop carries as its own attachment is served:
        a product image, a story's picture, another shop's file or an unknown id is the same 404 `media_not_found`.
        Every answer carries `Content-Security-Policy: sandbox; default-src 'none'`, `X-Frame-Options: DENY`,
        `Cross-Origin-Resource-Policy: same-origin` and `X-Content-Type-Options: nosniff`; a file is served with
        `Cache-Control: private, no-store`. An image, audio or video type is served inline under its own type; a PDF
        is an attachment typed application/pdf, anything else an attachment typed application/octet-stream. Range
        requests are answered. Each read is recorded in the shop's activity log against the key. Fetch it from your
        backend and serve it to your sellers yourself; the key never reaches a browser. 404 `not_found` while the
        inbox is switched off.
      x-scope: "inbox:media"
      x-feature: inbox.api
      responses:
        "200":
          description: The file
          headers:
            Cache-Control:
              schema: { const: "private, no-store" }
            Content-Security-Policy:
              schema: { const: "sandbox; default-src 'none'" }
            Content-Disposition:
              schema: { type: string }
          content:
            image/*:
              schema: { type: string, format: binary }
            audio/*:
              schema: { type: string, format: binary }
            video/*:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `media_not_found` (not a uuid, no message of this shop carries it, or the file is gone), or `not_found` (inbox switched off)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: "`media_unavailable` or `media_store_unavailable` (Retry-After: 5)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /onboarding-jobs:
    post:
      operationId: createOnboardingJob
      tags: [onboarding]
      summary: Preview a file or JSON list of businesses as one onboarding job
      description: |
        Either `multipart/form-data` (a `file` of CSV or XLSX, read by its bytes, at most 10 MiB and 64 MiB inflated,
        plus optional form fields `on_errors`, `defaults` as a JSON string and `auto_commit`) or `application/json`
        (at most 1 MiB). At most 2000 businesses. Nothing is provisioned: every row is judged exactly as createTenant
        judges its body, existing businesses of this partner are read (`unchanged`, or `owner_mismatch`) and taken
        owner emails are marked; the job answers `ready` with the counts. The file's columns, their Farsi and Arabic
        aliases and the row codes are in docs/backend/partner-api.md.

        Idempotent by job: the Idempotency-Key is bound to the content and the parameters (`format`, `on_errors`,
        `defaults`, `auto_commit`). The same key with the same request answers the existing job, 200, whatever it
        has become since; with another file or other parameters 422 `idempotency_key_reused`. A multipart body is
        never stored by the replay guard, so this is the only replay a file upload has.

        `auto_commit: true` starts the commit at once (the answer is `committing`), except for an `abort` job with
        failed rows, which stays `ready`. A job not committed within 24 h expires. 404 `not_found` while
        v3.partner.bulk_jobs is off.
      x-scope: tenants:provision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingJobRequest" }
            example:
              on_errors: skip
              auto_commit: false
              defaults: { market_profile: ir, reply_language: fa, owner_locale: fa }
              rows:
                - external_business_id: shop-1042
                  name: Golsara
                  metadata: { source: spring-campaign }
                  owner: { external_user_id: u-88, email: a@example.com, first_name: Sara, last_name: A., phone: "+989121234567" }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "CSV (UTF-8) or XLSX; the first visible sheet is read." }
                on_errors: { type: string, enum: [skip, abort], default: skip }
                defaults: { type: string, description: "A JSON object of market_profile, reply_language, owner_locale for blank cells." }
                auto_commit: { type: string, enum: ["true", "false"], default: "false" }
      responses:
        "201":
          description: The previewed job (or `committing` with auto_commit)
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingJob" }
        "200":
          description: The job this Idempotency-Key already names, as it is now
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingJob" }
        "400":
          description: "`bad_request_body`, `bad_multipart` (params.field, params.max_mb), `file_field_missing`, `file_unreadable`, `invalid_value` (field auto_commit or defaults), `idempotency_key_required` or `idempotency_key_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "413":
          description: "`file_too_large` (params.max_mb) or `idempotency_body_too_large` (params.max_mb)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "`file_format_unsupported` (an XLSX while workbooks are not read) or `file_xls_or_encrypted` (an .xls, or a password-protected .xlsx)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`columns_missing` (params.columns), `file_too_large_uncompressed`, `file_unreadable`, `import_file_invalid`, `too_many_rows` (params.max), `rows_missing`, `invalid_value` (field on_errors, params.allowed) or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: columns_missing
                code: columns_missing
                message: the file has no owner_email column

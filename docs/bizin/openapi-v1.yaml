      responses:
        "200":
          description: The order's receipts
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceList" }
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `order_not_found` (not a uuid or not this business's), or `not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tenants/{ext}/orders/{order_id}/payment-evidence/{evidence_id}/content:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/OrderID"
      - $ref: "#/components/parameters/EvidenceID"
    get:
      operationId: getPaymentEvidenceContent
      tags: [payments]
      summary: The receipt itself (the picture's bytes, or a typed receipt's text); every fetch is audited
      description: |
        Only a receipt of this order of this business is reachable, by its evidence id. A bank receipt carries card
        numbers and names: fetch it from your backend, never cache it, and show it only to the person who decides.
        Every answer carries `Content-Security-Policy: sandbox; default-src 'none'`, `X-Frame-Options: DENY`,
        `Cross-Origin-Resource-Policy: same-origin` and `X-Content-Type-Options: nosniff`; a receipt is served with
        `Cache-Control: private, no-store`. An image type is served inline under its own type; anything else is an
        attachment typed application/octet-stream. A typed receipt (`kind` text) answers JSON. Each answered fetch
        is written to the business's activity log (`payment_evidence.content_viewed`) with the key as the actor.
      x-scope: "payments:verify"
      x-feature: payments.verification
      responses:
        "200":
          description: The receipt
          headers:
            Cache-Control:
              schema: { const: "private, no-store" }
            Content-Security-Policy:
              schema: { const: "sandbox; default-src 'none'" }
            Content-Disposition:
              schema: { type: string }
          content:
            image/*:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceText" }
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EvidenceNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: "`media_unavailable` or `media_store_unavailable` (Retry-After: 5)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tenants/{ext}/orders/{order_id}/payment-evidence/{evidence_id}/approve:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/OrderID"
      - $ref: "#/components/parameters/EvidenceID"
    post:
      operationId: approvePaymentEvidence
      tags: [payments]
      summary: Approve a receipt; the whole total arrived and the order is paid
      description: |
        Approval attests the order's whole total arrived. The order moves from confirmed to paid, its payment status
        to paid, the order's other pending receipts are closed (`closed_reason` order_paid) and the customer is told
        once. Approving an approved receipt answers 200 and writes nothing. Audited with the key as the actor. While
        the business's payment verification is off the answer is 409 `payment_verification_off`.
      x-scope: "payments:verify"
      x-feature: payments.verification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: The order and the receipt after the decision
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceDecision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

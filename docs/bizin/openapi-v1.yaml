openapi: 3.1.0
info:
  title: Bizin Partner API
  version: v1
  summary: Provision businesses by external id, read their state, connect channels, receive signed webhooks.
  description: |
    The contract in prose is docs/backend/partner-api.md; this file matches backend/internal/partnerapi/routes.go
    (73 operations), and backend/internal/partnerapi/contract_doc_test.go fails when the two drift: every route with
    its x-scope and x-feature, the scope and event-type catalogues, each event's payload keys, and every closed enum
    the code keeps a list of.

    - Every POST, PATCH and DELETE requires an `Idempotency-Key` header (400 `idempotency_key_required` without it).
      A replay within 24 h answers the stored 2xx with `Idempotent-Replayed: true`; credential fields (`secret`,
      `activation_url`, `url` on connect links, `bot_token` on the Telegram connect) come back as `null` with
      `<field>_redacted_on_replay: true`. PUT and GET take no key; a PUT replaces one resource with its body.
    - Payment details are masked in every answer (last four digits only); a Telegram bot token is never returned.
    - Every authenticated answer carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.
    - Request bodies are decoded strictly: an unknown field is 400 `bad_request_body`.
    - Clients must ignore unknown response fields and unknown webhook event types; v1 changes only additively.
    - Every response enum is extensible (`x-extensible-enum`): a client must accept a value it does not know. The
      order status gained `packing` and the payment status `pending_verification` and `rejected` under this rule.
    - Unknown paths and unknown methods on known paths answer 404 `not_found` (no 405).
    - `{ext}` and `{product_ext}` in a path: percent-escape anything outside the unreserved URL characters; the
      server decodes the escape before the lookup (`shop%3A42` is `shop:42`). A malformed escape is 400.
    - Route status: every operation has a handler. The webhook operations answer 501 `not_implemented` only on a
      server started without its secrets keyring. The inbox operations answer 404 `not_found` while the
      v3.partner.inbox flag is off; moveConversationQueue also while v3.handoff.queues is off. The onboarding-job
      and catalogue-job operations answer 404 `not_found` while v3.partner.bulk_jobs is off.
    - Contract features (`x-feature` on an operation): the business's partner contract must include the feature, or the
      operation answers 403 `feature_not_entitled` with `params.feature`, before it reads or writes anything. The
      checks run in a fixed order: a hidden operation (flag off) is 404 `not_found`, then a key without the scope is
      403 `insufficient_scope`, then the feature of one of your businesses; any other `{ext}` is answered by the
      operation as before (404 `tenant_not_found`). A limit used up is 403 `entitlement_exceeded` with
      `params.limit`, `params.value` and `params.used`.
    - createOnboardingJob and createCatalogImportJob take a multipart file, which the replay guard never stores: its
      Idempotency-Key is bound to the job instead (same key and same request → the same job, 200; anything else → 422
      `idempotency_key_reused`).
servers:
  - url: https://api.bizin.app/partner/v1
    description: Production. The hostname goes live with PLAN 0.12 (direct-origin migration); not reachable before.
security:
  - partnerKey: []
tags:
  - name: key
  - name: tenants
  - name: channels
  - name: stats
  - name: catalog
  - name: payments
  - name: shipping
  - name: assistant
  - name: orders
  - name: cases
  - name: inbox
  - name: onboarding
  - name: entitlements
  - name: branding
  - name: webhooks

# Every authenticated answer carries these; the YAML anchor keeps each response's list in one place.
x-rate-limit-headers: &rateLimitHeaders
  RateLimit-Limit: { $ref: "#/components/headers/RateLimit-Limit" }
  RateLimit-Remaining: { $ref: "#/components/headers/RateLimit-Remaining" }
  RateLimit-Reset: { $ref: "#/components/headers/RateLimit-Reset" }

paths:
  /me:
    get:
      operationId: getMe
      tags: [key]
      summary: The calling key, its partner, scopes and limits
      x-scope: null
      responses:
        "200":
          description: The key's identity
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              example:
                partner_id: 5d0c2f8a-31a4-4f0e-b7a2-0c9e7d41a6b3
                key_id: kq3x7m2ta5rwze4d
                scopes: ["tenants:provision", "tenants:read", "channels:read", "channels:connect", "stats:read", "webhooks:manage", "users:activate"]
                limits: { api_rate_per_minute: 120, api_burst: 60, provision_per_day: 200 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tenants:
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Provision a business and its pending owner by external id
      description: |
        One transaction: tenant, signup trial credit, reply language, market profile, a `pending` owner (no password),
        the owner membership and the partner's refs. Creates data only. An external id this partner already holds
        answers 200 with `created: false` when the owner matches (same `owner.external_user_id` and `owner.email`),
        writes nothing and spends no quota; otherwise 409 `owner_mismatch`.
      x-scope: tenants:provision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
            example:
              external_business_id: biz-778
              name: Luna Store
              reply_language: en
              market_profile: intl
              metadata: { campaign: q4 }
              owner: { external_user_id: usr-4411, email: owner@shop.example, display_name: Lucia, locale: en }
      responses:
        "201":
          description: Created
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDetail" }
              example:
                tenant:
                  id: 0b1c6f0e-8d2a-4c3b-9a71-5e2f4d8c1a90
                  external_business_id: biz-778
                  name: Luna Store
                  status: active
                  reply_language: en
                  market_profile: intl
                  created_at: "2026-10-13T09:12:44.512Z"
                owner: { user_id: 7f2e1c4b-9a3d-4e8f-b2c6-1d5a7e9f0b38, external_user_id: usr-4411, status: pending }
                channels: []
                credit: { state: ok }
                created: true
        "200":
          description: The external id already exists with the same owner; its current state, `created` false
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`owner_email_in_use` (field owner.email), `owner_mismatch`, `owner_external_id_in_use` (field owner.external_user_id), or an idempotency conflict"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: "`invalid_value` (field + params.allowed for market_profile, reply_language, owner.locale), `external_business_id_invalid`, or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: invalid_value
                code: invalid_value
                message: "market_profile is required and must be one of ir, ae, intl"
                field: market_profile
                params: { allowed: [ir, ae, intl] }
                request_id: 6d3c0e7a-4f71-4c55-9e0b-6f1c2a8b9d10
        "429":
          description: "`rate_limited` (Retry-After) or `quota_exceeded` (params.quota = provision_per_day, params.limit; no Retry-After)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listTenants
      tags: [tenants]
      summary: The partner's businesses, newest first
      x-scope: tenants:read
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Outside 1-100 is 400 `limit_invalid` (params.max).
        - name: cursor
          in: query
          schema: { type: string }
          description: The previous page's `next_cursor`, opaque. One that does not parse is 400 `invalid_value` (field cursor).
      responses:
        "200":
          description: One page
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantList" }
              example:
                tenants:
                  - id: 0b1c6f0e-8d2a-4c3b-9a71-5e2f4d8c1a90
                    external_business_id: biz-778
                    name: Luna Store
                    status: active
                    reply_language: en
                    market_profile: intl
                    created_at: "2026-10-13T09:12:44.512Z"
                next_cursor: MjAyNi0xMC0xM1QwOToxMjo0NC41MTJafDBiMWM2ZjBlLThkMmEtNGMzYi05YTcxLTVlMmY0ZDhjMWE5MA
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tenants/{ext}:
    parameters:
      - $ref: "#/components/parameters/Ext"
    get:
      operationId: getTenant
      tags: [tenants]
      summary: One business, its owner, channels and credit state
      x-scope: tenants:read
      responses:
        "200":
          description: The business
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDetail" }
              example:
                tenant:
                  id: 0b1c6f0e-8d2a-4c3b-9a71-5e2f4d8c1a90
                  external_business_id: biz-778
                  name: Luna Store
                  status: active
                  reply_language: en
                  market_profile: intl
                  created_at: "2026-10-13T09:12:44.512Z"
                owner: { user_id: 7f2e1c4b-9a3d-4e8f-b2c6-1d5a7e9f0b38, external_user_id: usr-4411, status: active }
                channels:
                  - { channel_id: 3e9b7c21-5a4d-4f86-9c0e-1b2d3f4a5c6e, kind: instagram, status: connected, connected_at: "2026-10-13T10:02:11Z" }
                credit: { state: ok }
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tenants/{ext}/channels:
    parameters:
      - $ref: "#/components/parameters/Ext"
    get:
      operationId: getTenantChannels
      tags: [channels]
      summary: Channel kind and status; no handle, platform id or token
      x-scope: channels:read
      responses:
        "200":
          description: The tenant's channel accounts in creation order
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
              example:
                channels:
                  - { channel_id: 3e9b7c21-5a4d-4f86-9c0e-1b2d3f4a5c6e, kind: instagram, status: connected, connected_at: "2026-10-13T10:02:11Z",
                      health: { state: broken, reason: ig_subscription_missing, since: "2026-10-17T08:40:00Z" } }
                  - { channel_id: a1f4c8d2-6b3e-4e7a-9d05-2c8b1e6f4a73, kind: whatsapp, status: disconnected, connected_at: null, health: null }
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tenants/{ext}/stats:
    parameters:
      - $ref: "#/components/parameters/Ext"
    get:
      operationId: getTenantStats
      tags: [stats]
      summary: Daily counts over inclusive UTC days, zeros included
      description: The range is validated before the tenant is looked up. At most 92 days.
      x-scope: stats:read
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Default the 7 days ending at `to`. Unparseable is 400 `invalid_value` (field from).
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Default today (UTC). Unparseable is 400 `invalid_value` (field to).
      responses:
        "200":
          description: One entry per day of the range
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items: { $ref: "#/components/schemas/StatsDay" }
              example:
                days:
                  - { date: "2026-10-01", conversations_started: 14, automated_replies: 41, handoffs: 3, orders_created: 2 }
                  - { date: "2026-10-02", conversations_started: 9, automated_replies: 27, handoffs: 1, orders_created: 0 }
        "400":
          description: "`stats_range_invalid` (params.max_days), `invalid_value` (field from/to), or `external_business_id_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tenants/{ext}/connect-links:
    parameters:
      - $ref: "#/components/parameters/Ext"
    post:
      operationId: createConnectLink
      tags: [channels]
      summary: A single-use, 15-minute link to the Bizin-hosted Instagram connect page
      description: |
        After Meta the seller's browser returns to `return_url` with `status=connected|failed`, `channel=instagram`,
        `link=<id>` and, on failure, `reason` (denied, state, browser, exchange, scope, profile, taken, config, server).
        `url` is redacted on replay.
      x-scope: channels:connect
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectLinkRequest" }
            example: { channel: instagram, return_url: "https://partner.example/onboarding/done", replace: false }
      responses:
        "201":
          description: The link
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectLink" }
              example:
                id: c41a9e27-6b3f-4d58-8e0a-2f7c1b9d6e45
                url: "https://www.bizin.app/connect/cl_Zx3..."
                expires_at: "2026-10-13T10:17:11Z"
        "400":
          description: "`channel_not_supported` (params.allowed), `return_url_not_allowed` (field return_url), `bad_request_body`, `external_business_id_invalid`, or an Idempotency-Key error"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "409":
          description: "`channel_already_connected` (replace false), or an idempotency conflict"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/owner/activation-link:
    parameters:
      - $ref: "#/components/parameters/Ext"
    post:
      operationId: createActivationLink
      tags: [tenants]
      summary: A single-use, 72-hour activation link for the pending owner
      description: No body is read. A new call voids the previous unused link. `activation_url` is redacted on replay.
      x-scope: users:activate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The link
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationLink" }
              example:
                activation_url: "https://www.bizin.app/activate/Q2x..."
                expires_at: "2026-10-16T09:20:03Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "409":
          description: "`owner_already_active`, `owner_not_pending`, or an idempotency conflict"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/channels/whatsapp:
    parameters:
      - $ref: "#/components/parameters/Ext"
    post:
      operationId: connectWhatsApp
      tags: [channels]
      summary: Create a WhatsApp channel and start its QR pairing; poll the pairing route for the QR
      description: |
        Each call creates a new WhatsApp channel account (status pairing). One pairing per business at a time: while one
        is still waiting for its scan the answer is 409 `whatsapp_pairing_in_progress`. A replay returns the first
        answer's channel_id and starts nothing. A pairing that ends without a scan leaves its channel behind; delete it.
      x-scope: channels:connect
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsAppConnectRequest" }
            example: { display_name: Luna WhatsApp }
      responses:
        "201":
          description: The pairing has started; no QR yet
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelConnect" }
              example: { channel_id: a1f4c8d2-6b3e-4e7a-9d05-2c8b1e6f4a73, status: pending }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "409":
          description: "`whatsapp_pairing_in_progress`, or an idempotency conflict"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/KeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: "`channel_create_failed` or `internal_error`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`whatsapp_pairing_failed`: the session could not start; the channel is left in error"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/channels/whatsapp/{channel_id}/pairing:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/ChannelID"
    get:
      operationId: getWhatsAppPairing
      tags: [channels]
      summary: Poll a WhatsApp pairing; carries the current QR payload while one is live
      description: |
        Keep polling until connected, failed or expired; WhatsApp rotates the QR, so each `qr` replaces the previous.
        Not a WhatsApp channel of this business is 404 `channel_account_not_found`.
      x-scope: channels:connect
      responses:
        "200":
          description: The pairing state
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pairing" }
              example: { status: qr, qr: "2@Yk7f...,Qm9x...,c2Vj...,MTIz...", expires_at: "2026-10-13T10:05:31Z" }
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `channel_account_not_found`, or `not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tenants/{ext}/channels/telegram:
    parameters:
      - $ref: "#/components/parameters/Ext"
    post:
      operationId: connectTelegram
      tags: [channels]
      summary: Connect a Telegram bot by its token; connected when the answer comes
      description: |
        The token is checked with Telegram, stored sealed and never returned: no answer, error, log line or replay
        carries it (`bot_token` is also on the replay redaction list). Needs the v3.channels.telegram flag on for the
        business.
      x-scope: channels:connect
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramConnectRequest" }
            example: { bot_token: "7012345678:AAH...", display_name: Luna Bot }
      responses:
        "201":
          description: The bot is connected
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelConnect" }
              example: { channel_id: 6d2a9f40-1c7b-4e3d-8a5f-9b0e2c4d7f18, status: connected }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "409":
          description: "`telegram_bot_taken`, or an idempotency conflict"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: "`telegram_token_invalid` or `telegram_token_rejected` (field bot_token), or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502":
          description: "`telegram_failed`: Telegram could not be reached; nothing is kept"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`telegram_unavailable` (flag off or bots cannot be connected now), or `idempotency_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tenants/{ext}/channels/{channel_id}:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/ChannelID"
    delete:
      operationId: disconnectChannel
      tags: [channels]

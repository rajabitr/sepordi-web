  /tenants/{ext}/cases/{case_id}/photos/{photo_id}:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/CaseID"
      - $ref: "#/components/parameters/PhotoID"
    get:
      operationId: getCasePhoto
      tags: [cases]
      summary: The bytes of one photo the customer sent for this case
      description: |
        Only a photo listed in the case's `photos` is reachable, by that id. Every answer carries
        `Content-Security-Policy: sandbox; default-src 'none'`, `X-Frame-Options: DENY`,
        `Cross-Origin-Resource-Policy: same-origin` and `X-Content-Type-Options: nosniff`; a photo is served with
        `Cache-Control: private, no-store`. An image type is served inline under its own type; anything else is an
        attachment typed application/octet-stream. Range requests are answered. Fetch it from your backend and serve
        it to your sellers yourself.
      x-scope: "cases:read"
      x-feature: returns.cases
      responses:
        "200":
          description: The photo
          headers:
            Cache-Control:
              schema: { const: "private, no-store" }
            Content-Security-Policy:
              schema: { const: "sandbox; default-src 'none'" }
            Content-Disposition:
              schema: { type: string }
          content:
            image/*:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `photo_not_found` (not a uuid, not this case's photo, or the picture is gone), or `not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: "`media_unavailable` or `media_store_unavailable` (Retry-After: 5)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tenants/{ext}/cases/{case_id}/actions:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/CaseID"
    post:
      operationId: actOnCase
      tags: [cases]
      summary: Record the shop's decision on a case; audited with the key as actor
      description: |
        Needs an Idempotency-Key; a replay answers the stored case and records nothing twice. The body is checked
        before the business is looked up. `expected_state` is the state you saw: a case that moved since is 409
        `case_state_conflict`, and a case in a final state (rejected, refunded, exchanged, closed) is 409
        `case_closed`. Allowed moves are open to awaiting_customer (request_info); open or awaiting_customer to
        accepted or rejected; accepted to refunded (mark_refunded) or exchanged (mark_exchanged); any open state to
        closed. Bizin moves no money and never changes the order. With `notify_customer` (default true) the customer
        gets a fixed message for the action; it carries the case code and no amount. The refund record is never in a
        webhook.
      x-scope: "cases:write"
      x-feature: returns.cases
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseAction" }
            example: { action: mark_refunded, expected_state: accepted, refund: { amount: 12000000, reference: "123456789012" }, note: Paid back by card. }
      responses:
        "200":
          description: The case after the decision, as GET reads it
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409":
          description: "`case_state_conflict`, `case_closed`, `idempotency_request_in_progress` or `idempotency_replay_unavailable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: "`invalid_action` (field action, expected_state, reject_reason, refund, refund.amount, refund.reference or note), `refund_exceeds_total` (field refund.amount), or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/return-policy:
    parameters:
      - $ref: "#/components/parameters/Ext"
    get:
      operationId: getReturnPolicy
      tags: [cases]
      summary: The shop's return policy, the only return terms the assistant ever shows a customer
      x-scope: "assistant:read"
      responses:
        "200":
          description: The policy
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnPolicy" }
        "400": { $ref: "#/components/responses/BadExternalID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`tenant_not_found`, `return_policy_not_set`, or `not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: putReturnPolicy
      tags: [cases]
      summary: Replace the shop's return policy; audited with the key as actor
      description: |
        Takes no Idempotency-Key (one sent is ignored); the same body twice leaves the same policy. The body is
        checked before the business is looked up. The conditions are shown to customers exactly as written, in the
        language they are written in; Bizin adds a framing sentence and, when `window_days` is set, one sentence with
        that number. With `enabled: false`, or no policy, the assistant states no return terms at all.
      x-scope: "assistant:write"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnPolicyPut" }
            example: { enabled: true, window_days: 7, conditions: "کالا باید پلمپ و با فاکتور باشد." }
      responses:
        "200":
          description: The stored policy
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: "`invalid_value` (field window_days or conditions), `return_policy_empty` (field conditions), or `idempotency_key_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /tenants/{ext}/conversations:
    parameters:
      - $ref: "#/components/parameters/Ext"
    get:
      operationId: listConversations
      tags: [inbox]
      summary: The business's conversations, newest activity first
      description: |
        The query is checked before the business is looked up. Repeated values of one parameter match any of them;
        different parameters must all match. Send the same filters with a cursor, and start without one when the
        filters change. Answers whatever
        the business's assistant setting is. While v3.partner.inbox is off every inbox route answers 404 `not_found`,
        whatever the key's scopes. React to webhooks; do not poll faster than once per 10 s per business.
      x-scope: "inbox:read"
      x-feature: inbox.api
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/HandoffState" }
          description: Repeatable; default all. Any other value is 400 `invalid_value` (field state, params.allowed).
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/ChannelKind" }
          description: Any other value is 400 `invalid_value` (field channel, params.allowed).
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: RFC 3339; only conversations whose last_message_at is at or after it. Unparseable is 400 `invalid_value` (field since).
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: "Needs v3.inbox.filters (every parameter from here on is 400 `filter_unavailable` while it is off, even empty). RFC 3339; only conversations whose last_message_at is before it (exclusive). Unparseable is 400 `invalid_value` (field until)."
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [open, snoozed, closed] }
          description: "Needs v3.inbox.filters. Repeatable. Any other value is 400 `invalid_value` (field status, params.allowed)."
        - name: queue
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/HandoffQueue" }
          description: "Needs v3.inbox.filters. Repeatable. The queue stays after the handoff ends; combine it with state for the open handoffs of a queue. Any other value is 400 `invalid_value` (field queue, params.allowed)."
        - name: priority
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [low, normal, high, urgent] }
          description: "Needs v3.inbox.filters. Repeatable. Any other value is 400 `invalid_value` (field priority, params.allowed)."
        - name: reason
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
          description: "Needs v3.inbox.filters. Repeatable; a handoff reason token, matched against the current handoff only. New tokens appear over time, so a malformed one is 400 `invalid_value` (field reason) without params.allowed."
        - name: reason_class
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [EXPLICIT_HUMAN_REQUEST, POLICY_REQUIRED, PAYMENT_VERIFICATION, CLARIFICATION_EXHAUSTED, HIGH_RISK_LOW_CONFIDENCE, INTEGRATION_FAILURE, SYSTEM_FAILURE, NONE] }
          description: "Needs v3.inbox.filters. Repeatable. Any other value is 400 `invalid_value` (field reason_class, params.allowed)."
        - name: intent
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, maxLength: 96 }
          description: "Needs v3.inbox.filters. Repeatable; an intent code (commerce.purchase.ask_price) or a parent intent (commerce.purchase), matched against the latest classified intent or its parent: what the customer is talking about now. Anything else is 400 `invalid_value` (field intent)."
        - name: q
          in: query
          schema: { type: string, minLength: 2, maxLength: 64 }
          description: "Needs v3.inbox.filters. 2 to 64 characters after trimming; matches the customer's display name (Arabic and Persian letters alike) or phone (Persian and Arabic digits read as Latin). Never a platform id (JID, Instagram id, Telegram chat id) and never message text. Out of range is 400 `invalid_value` (field q, params.min, params.max)."
        - name: order_id
          in: query
          schema: { type: string, format: uuid }
          description: "Needs v3.inbox.filters. An order of this business: the conversation it was written on. Another business's order gives an empty list. Not a uuid is 400 `invalid_value` (field order_id)."
        - name: has_order
          in: query
          schema: { type: boolean }
          description: "Needs v3.inbox.filters. Whether an order of this business was written on the conversation. Not true or false is 400 `invalid_value` (field has_order, params.allowed)."
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tenants/{ext}/conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/Ext"
      - $ref: "#/components/parameters/ConversationID"
    get:
      operationId: getConversation
      tags: [inbox]
      summary: One conversation — state, handoff, customer contact, the newest message; the read behind the inbox webhooks
      x-scope: "inbox:read"
      x-feature: inbox.api
      responses:
        "200":
          description: The conversation
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
              example:
                id: c7e2a9f4-1b3d-4e5f-8a6b-9c0d1e2f3a4b
                channel_kind: instagram
                status: open
                state: handoff
                handoff: { reason: customer_request, raised_at: "2026-10-14T09:12:03Z" }
                held_since: null
                customer: { id: 5d1e7c3a-2b4f-4e6a-9c8d-0f1e2d3c4b5a, display_name: Reza, phone: null }

      summary: Narrow one business within your contract, or drop your narrowing
      description: |
        You can only narrow: a feature your contract lacks or a limit above your contract's is refused, and only Bizin
        support widens one business. An entry Bizin support set is theirs (409). Entries the body does not name keep
        their value. No Idempotency-Key: a save that changes nothing writes nothing, is not audited and sends no

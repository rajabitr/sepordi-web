        "200":
          description: The stored settings
          headers: *rateLimitHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assistant" }
        "400":
          description: "`bad_request_body` (over 64 KiB too) or `external_business_id_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "422":
          description: "`invalid_value`: field enabled or auto_reply (missing), field reply_language with params.allowed (missing or unknown), or no field (persona_name over 80 or business_profile over 4000 characters)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tenants/{ext}/orders:
    parameters:
      - $ref: "#/components/parameters/Ext"
    get:
      operationId: listOrders
      tags: [orders]
      summary: The business's orders, newest first
